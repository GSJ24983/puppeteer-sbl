}]};

/* ---------------------------- learner result (trainee edition: one learner, one scenario) ---------------------------- */
var D={results:[],open:null};
function b64(s){try{return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(x){return '';}}
function unb64(c){try{var b=c.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return JSON.parse(decodeURIComponent(escape(atob(b))));}catch(x){return null;}}
function parseResults(txt){var out=[],seen={},m,re=/PUP2:([A-Za-z0-9_-]+)/g;
  while((m=re.exec(txt))){if(seen[m[1]])continue;seen[m[1]]=1;var r=unb64(m[1]);if(r&&r.s&&r.log)out.push(r);}return out;}
function curDeck(){try{return JSON.parse(srcEl.value);}catch(x){return null;}}
function choiceGood(n,c){var any=(n.choices||[]).some(function(x){return x.consequence&&x.consequence.good;});
  if(c.consequence&&c.consequence.good)return true;if(any)return false;if(n.gate)return c.correct!==false;return null;}
function cutP(x,n){x=String(x||'').replace(/\*\*(\S(?:[^\n]*?\S)?)\*\*/g,'$1').replace(/(^|[^A-Za-z0-9_])__(\S(?:[^\n]*?\S)?)__(?![A-Za-z0-9_])/g,'$1$2').replace(/\s+/g,' ').trim();if(x.length<=n)return x;var c=x.slice(0,n),i=c.lastIndexOf('. ');
  return i>50?c.slice(0,i+1):c.replace(/\s\S*$/,'')+' ...';}
function pathOf(s,r){var nodes=s.nodes||{},seen={},grp=[],out=[];
  (r.log||[]).forEach(function(l){var k=l.n+'|'+l.k;if(!(k in seen)){seen[k]=grp.length;grp.push({l:null,tried:[]});}
    var g=grp[seen[k]];if(l.k==='c'&&l.g)g.tried.push(l.i);else g.l=l;});
  grp.forEach(function(g,gi){var l=g.l;if(!l)return;var n=nodes[l.n];if(!n)return;
    var lab=(typeof n.step==='number'&&s.steps&&s.steps[n.step])||('Step '+(gi+1)),hd='<div class="pk">'+esc(lab)+'</div>';
    if(l.k==='c'){var c=(n.choices||[])[l.i]||{},gd=choiceGood(n,c),cq=c.consequence||{};
      out.push('<div class="pn">'+hd+'<div class="pq">'+esc(cutP(n.prompt,120))+'</div><div class="po">'+(n.choices||[]).map(function(o,i){
        var k=esc(o.k||String.fromCharCode(65+i)),x=esc(o.tag||o.chip||cutP(o.label,36));
        if(i===l.i)return '<span class="pc on '+(gd===true?'good':gd===false?'trap':'')+'">'+k+' · '+x+'</span>';
        return '<span class="pc'+(g.tried.indexOf(i)>-1?' tried':'')+'">'+k+' · '+x+'</span>';}).join('')+'</div></div>');
      if(cq.text)out.push('<div class="pa"></div><div class="pcq '+(cq.good?'good':gd===false?'trap':'')+'"><b>'+esc(cq.title||'What happened')+'</b>'+esc(cutP(cq.text,150))+'</div>');}
    if(l.k==='m'){var need=n.correct||[],sel=l.sel||[];
      out.push('<div class="pn">'+hd+'<div class="pq">Noticed '+need.filter(function(i){return sel.indexOf(i)>-1;}).length+' of '+need.length+'</div><div class="po">'+
        (n.options||[]).map(function(o,i){var p=sel.indexOf(i)>-1,m=need.indexOf(i)>-1,x=esc(cutP(o.label,42));
          return p&&m?'<span class="pc hit">&#10003; '+x+'</span>':p?'<span class="pc extra">&#10007; '+x+'</span>':m?'<span class="pc miss">missed: '+x+'</span>':'';}).join('')+'</div></div>');}
    if(l.k==='w'){var met=l.met||[];
      out.push('<div class="pn">'+hd+'<div class="pq">Final answer met '+met.filter(Boolean).length+' of '+(n.criteria||[]).length+
        ' - '+(l.tr||1)+' attempt'+((l.tr||1)>1?'s':'')+'</div><div class="po">'+(n.criteria||[]).map(function(c,i){
          return '<span class="pc '+(met[i]?'hit':'miss')+'">'+(met[i]?'&#10003; ':'')+esc(c.hint||cutP(c.label,36))+'</span>';}).join('')+'</div></div>');}
    out.push('<div class="pa"></div>');});
  var e=(s.endings||{})[r.end]||{};
  out.push('<div class="pend">'+esc(e.title||r.end||'No ending')+'</div>');
  return '<div class="dpath">'+out.join('')+'</div>';}
function plain(s,r){var nodes=s.nodes||{},h='<dl class="drill">';
  (r.log||[]).forEach(function(l){var n=nodes[l.n];if(!n||(l.k==='c'&&l.g))return;
    if(l.k==='c'){var c=(n.choices||[])[l.i]||{};h+='<dt>'+esc(cutP(n.prompt||n.title||l.n,96))+'</dt><dd>'+esc(c.label||'')+'</dd>';}
    if(l.k==='m'){var need=n.correct||[],sel=l.sel||[],opts=n.options||[];
      var miss=need.filter(function(i){return sel.indexOf(i)<0;}).map(function(i){return opts[i]?opts[i].label:'?';});
      h+='<dt>Noticing - '+esc(cutP(n.prompt,96))+'</dt><dd>'+(need.length-miss.length)+' of '+need.length+(miss.length?'\nMissed: '+esc(miss.join('; ')):'')+'</dd>';}
    if(l.k==='w'){h+='<dt>Written - '+(l.tr||1)+' attempt'+((l.tr||1)>1?'s':'')+'</dt><dd>'+esc(l.a)+'\n\n'+
      (n.criteria||[]).map(function(c,i){return ((l.met||[])[i]?'[met] ':'[not yet] ')+esc(c.label);}).join('\n')+'</dd>';}});
  return h+'</dl>';}
function renderDash(){var box=document.getElementById('dashOut'),deck=curDeck(),cnt=document.getElementById('dashCount');
  if(!D.results.length){cnt.textContent='';box.innerHTML='<p class="dnote">Paste one learner\'s message and press Show result. Keep their scenario loaded on the left.</p>';return;}
  var r=D.results[0],s=null;((deck&&deck.scenarios)||[]).forEach(function(x){if(x.id===r.s)s=x;});
  cnt.textContent=D.results.length>1?'Showing the first of '+D.results.length+' results - this edition reads one at a time.':'';
  if(!s){box.innerHTML='<p class="dnote">This result is for scenario "'+esc(r.s)+'". Load that scenario on the left first.</p>';return;}
  var e=(s.endings||{})[r.end]||{};
  box.innerHTML='<div class="dcard"><h3>'+esc(r.n||'Learner')+' - '+esc(s.title)+'</h3><p class="dnote">Ending: '+esc(e.title||r.end||'none')+
    (r.at?' - sent '+esc(String(r.at).slice(0,10)):'')+'</p>'+pathOf(s,r)+plain(s,r)+'</div>';}

/* ---------------------------- wiring ---------------------------- */
document.getElementById('btnRun').addEventListener('click',run);
document.getElementById('btnExportT').addEventListener('click',function(){download('trainee');});
document.getElementById('btnSample').addEventListener('click',function(){
  srcEl.value=JSON.stringify(JSON.parse(document.getElementById('sample').textContent),null,2);run();});
document.getElementById('btnSkel').addEventListener('click',function(){
  srcEl.value=JSON.stringify(SKELETON,null,2);run();});
document.getElementById('btnDash').addEventListener('click',function(){
  D.results=parseResults(document.getElementById('resIn').value);D.open=null;renderDash();});
document.getElementById('btnClear').addEventListener('click',function(){
  document.getElementById('resIn').value='';D.results=[];D.open=null;renderDash();});

Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('on');});
    t.classList.add('on');document.getElementById('p-'+t.getAttribute('data-p')).classList.add('on');
  });
});
function segWire(id,fn){var g=document.getElementById(id);
  Array.prototype.forEach.call(g.querySelectorAll('button'),function(b){b.addEventListener('click',function(){
    g.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');fn(b);});});}
segWire('wseg',function(b){frame.className=b.getAttribute('data-w')==='mob'?'mob':'';});
segWire('rtabs',function(b){var db=b.getAttribute('data-r')==='db';
  document.getElementById('r-pv').classList.toggle('on',!db);document.getElementById('r-db').classList.toggle('on',db);
  document.getElementById('wseg').style.visibility=db?'hidden':'';
  if(db)renderDash();});
srcEl.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&(e.key==='Enter'||e.key==='s')){e.preventDefault();run();}
  if(e.key==='Tab'){e.preventDefault();var s=srcEl.selectionStart;
    srcEl.value=srcEl.value.slice(0,s)+'  '+srcEl.value.slice(srcEl.selectionEnd);
    srcEl.selectionStart=srcEl.selectionEnd=s+2;}
});

document.getElementById('docs').innerHTML=document.getElementById('docsrc').textContent;
srcEl.value=JSON.stringify(JSON.parse(document.getElementById('sample').textContent),null,2);
run();
</script>
