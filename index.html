<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppeteer Studio</title>
<style>
:root{
  --indigo:#201A3E;--deep:#15112B;--surface:#2B2456;--surf2:#352C68;--coral:#FF6B4A;
  --teal:#16B5A4;--lav:#B9AEE8;--ink:#F3F0FF;--mute:#A79EC9;--line:#463C7F;--gold:#F2C14E;
  --serif:'Fraunces','Iowan Old Style',Georgia,serif;
  --sans:'Instrument Sans','Segoe UI',system-ui,-apple-system,Calibri,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--deep);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.bar{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--indigo);flex:none;flex-wrap:wrap}
.bar svg{width:26px;height:26px;flex:none}
.bar h1{font-family:var(--serif);font-size:16px;margin:0;font-weight:600}
.bar .sp{flex:1}
.bar .st{font-size:12.5px;color:var(--mute);font-family:var(--mono)}
.bar .st.ok{color:var(--teal)}
.bar .st.bad{color:var(--coral)}
.btn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:7px 13px;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--lav)}
.btn.go{background:var(--coral);border-color:var(--coral);color:#25100A;font-weight:650}
.btn.go:hover{background:#FF835F}
.btn.tl{background:var(--teal);border-color:var(--teal);color:#04211E;font-weight:650}
.btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2A1E00;font-weight:650}

main{flex:1;display:grid;grid-template-columns:minmax(340px,40%) 1fr;min-height:0}
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:8px 10px 0;flex:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);
  padding:7px 12px;font-size:13.5px;cursor:pointer}
.tab.on{color:var(--ink);border-bottom-color:var(--coral)}
.pane{flex:1;min-height:0;display:none}
.pane.on{display:flex;flex-direction:column}
textarea{flex:1;width:100%;background:var(--deep);color:#DCD6F5;border:0;border-top:1px solid var(--line);
  padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:none}
textarea:focus{outline:none}
.doc{overflow:auto;padding:16px 20px 40px;border-top:1px solid var(--line);font-size:14px;line-height:1.6}
.doc h2{font-family:var(--serif);font-size:17px;margin:20px 0 6px;font-weight:600}
.doc h2:first-child{margin-top:0}
.doc p{color:#DCD6F5;margin:0 0 10px;max-width:62ch}
.doc code{font-family:var(--mono);font-size:12px;background:var(--surface);padding:1px 5px;border-radius:4px;color:var(--lav)}
.doc pre{background:var(--indigo);border:1px solid var(--line);border-radius:9px;padding:12px 14px;
  overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.55;color:#CFC7F0}
.doc ul{margin:0 0 12px;padding-left:19px;color:#DCD6F5}
.doc li{margin-bottom:5px}
.doc .k{color:var(--gold)}
.doc .new{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:700;color:#2A1E00;background:var(--gold);border-radius:99px;padding:1px 8px;vertical-align:2px;margin-left:6px}
.right{min-height:0;display:flex;flex-direction:column;background:var(--indigo)}
.phead{padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute);
  display:flex;align-items:center;gap:10px;flex:none;flex-wrap:wrap}
.phead .seg{display:flex;gap:2px;background:var(--deep);border-radius:7px;padding:2px}
.phead .seg button{background:none;border:0;color:var(--mute);font-size:12.5px;padding:5px 11px;border-radius:5px;cursor:pointer}
.phead .seg button.on{background:var(--surface);color:var(--ink)}
.phead .sp{flex:1}
.rpane{flex:1;min-height:0;display:none}
.rpane.on{display:flex;flex-direction:column}
.frameWrap{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;padding:14px}
iframe{border:1px solid var(--line);border-radius:12px;background:var(--deep);width:100%;height:100%}
iframe.mob{width:390px;max-width:100%;height:100%;max-height:780px}
.err{margin:0;padding:11px 16px;background:rgba(255,107,74,.12);border-top:1px solid var(--coral);
  color:#FFC5B5;font-family:var(--mono);font-size:12px;white-space:pre-wrap;flex:none}
.tipbar{margin:0;padding:9px 16px;background:rgba(242,193,78,.10);border-top:1px solid var(--gold);color:#F6DFA3;font-size:12.5px;flex:none}
.hidden{display:none!important}

/* session dashboard */
.dash{flex:1;overflow:auto;padding:14px 18px 40px;font-size:14px;line-height:1.5}
.dash textarea{flex:none;min-height:96px;border:1px solid var(--line);border-radius:9px;font-size:12px}
.drow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.dnote{color:var(--mute);font-size:13px;margin:0}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.dcard h3{font-family:var(--serif);font-size:17px;margin:0 0 4px;font-weight:600}
.dcard h4{font-size:13.5px;margin:0 0 8px;color:var(--lav);font-weight:600}
.dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0 0}
.dtile{background:var(--deep);border-radius:9px;padding:8px 10px}
.dtile small{display:block;color:var(--mute);font-size:11.5px}
.dtile b{font-size:20px;font-variant-numeric:tabular-nums}
.bar2{margin:7px 0}
.bar2 .l{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.bar2 .l span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar2 .t{height:7px;background:var(--deep);border-radius:4px;margin-top:3px}
.bar2 .f{height:7px;border-radius:4px;background:var(--lav)}
.bar2.good .f{background:var(--teal)}
.bar2.trap .f{background:var(--coral)}
.tg{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;margin-left:4px}
.tg.good{background:var(--teal);color:#04211E}
.tg.trap{background:var(--coral);color:#25100A}
.ins{margin:8px 0 0;font-size:13px;color:#DCD6F5;border-left:3px solid var(--gold);padding:3px 10px}
.ans{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:6px 0;font-size:13px;color:#DCD6F5;white-space:pre-line}
.ans small{display:block;color:var(--mute);font-size:11.5px;margin-bottom:3px}
table.lt{width:100%;border-collapse:collapse;font-size:13px}
.lt th,.lt td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.lt th{color:var(--mute);font-weight:600;font-size:12px}
.lt tr.click{cursor:pointer}
.lt tr.click:hover td{background:var(--surf2)}
.drill{margin:0}
.dpath{display:flex;flex-direction:column;margin:4px 0 14px}
.dpath .pn{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--surf2)}
.dpath .pk{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:650}
.dpath .pq{font-size:13px;margin:2px 0 6px}
.dpath .po{display:flex;flex-wrap:wrap;gap:5px}
.dpath .pc{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--mute)}
.dpath .pc.on{color:#fff;font-weight:650;border-color:transparent;background:#6B6F8A}
.dpath .pc.on.good,.dpath .pc.hit{background:var(--teal);color:#04211E;border-color:transparent}
.dpath .pc.on.trap,.dpath .pc.extra{background:var(--coral);color:#25100A;border-color:transparent}
.dpath .pc.tried{text-decoration:line-through;border-style:dashed}
.dpath .pc.miss{border:1.5px dashed var(--teal);color:var(--ink)}
.dpath .pa{width:2px;height:14px;background:var(--line);margin:0 auto}
.dpath .pcq{border-left:4px solid #6B6F8A;border-radius:6px;padding:6px 10px;background:var(--deep);font-size:12.5px;color:#DCD6F5}
.dpath .pcq.good{border-left-color:var(--teal)}.dpath .pcq.trap{border-left-color:var(--coral)}
.dpath .pcq b{display:block;color:var(--ink);font-size:12px}
.dpath .pend{border:2px solid var(--ink);border-radius:9px;padding:7px 10px;text-align:center;font-weight:650;font-size:13px}
.drill dt{font-weight:600;margin-top:10px;color:var(--ink)}
.drill dd{margin:2px 0 0;color:#DCD6F5;white-space:pre-line}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.left{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header class="bar">
  <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">

<main>
  <section class="left">
    <div class="tabs">
      <button class="tab on" data-p="edit">Scenario JSON</button>
      <button class="tab" data-p="docs">Schema</button>

      <span class="seg" id="wseg"><button class="on" data-w="desk">Laptop</button><button data-w="mob">Mobile</button></span>
    </div>
    <div class="rpane on" id="r-pv"><div class="frameWrap"><iframe id="frame" title="Preview"></iframe></div></div>
    <div class="rpane" id="r-db"><div class="dash">
      <textarea id="resIn" spellcheck="false" placeholder="Paste one learner's message - a whole WhatsApp or email message is fine. The first PUP2: result code in it is read."></textarea>
      <div class="drow">
        <button class="btn go" id="btnDash">Show result</button>
        <button class="btn" id="btnClear">Clear</button>
        <span class="dnote" id="dashCount"></span>
      </div>
      <div id="dashOut"></div>
    </div></div>
  </section>
</main>

<script type="text/plain" id="engine"><!DOCTYPE html>
<html lang="en">
<head>

:root{

  --coral:#FF6B4A; --coral2:#FF835F; --onCoral:#25100A; --teal:#16B5A4; --onTeal:#04211E; --blue:#0070C0;
  --lav:#B9AEE8; --ink:#F3F0FF; --mute:#A79EC9; --line:#463C7F; --gold:#F2C14E;
  --body:#DCD6F5; --tint:rgba(43,36,86,.55); --shadow:none;
  --serif:'Fraunces','Iowan Old Style',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans','Segoe UI',system-ui,-apple-system,Calibri,sans-serif;
}

html[data-theme='light']{
  --indigo:#EAF0F8; --deep:#FFFFFF; --surface:#F4F8FC; --surf2:#E7EFF8;
  --coral:#0B5FBF; --coral2:#0A54A8; --onCoral:#FFFFFF; --teal:#0E7C6B; --onTeal:#FFFFFF; --blue:#0B5FBF;
  --lav:#2C5C92; --ink:#10233B; --mute:#5C7288; --line:#CFDDEC; --gold:#9A6B0F;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--deep);color:var(--ink);font-family:var(--sans);line-height:1.55;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 64px}
a{color:var(--lav)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

/* masthead */
.mast{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.strings{width:34px;height:34px;flex:none}
.mast h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:.1px}
.mast .sub{color:var(--mute);font-size:13px;margin-left:auto}
.themeBtn{background:var(--surface);border:1px solid var(--line);color:var(--mute);border-radius:7px;
  width:30px;height:30px;display:grid;place-items:center;cursor:pointer;padding:0}
.themeBtn:hover{color:var(--ink);border-color:var(--lav)}

/* hub */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:24px}
.xcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/9;background:var(--indigo)}
.thumb svg{display:block;width:100%;height:100%}
.xbody{padding:16px 16px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
.tagrow{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.tag.hot{background:var(--teal);border-color:var(--teal);color:var(--onTeal);font-weight:600}
.xcard h2{font-family:var(--serif);font-size:20px;margin:2px 0 0;font-weight:600}
.xcard p{margin:0;color:var(--mute);font-size:14px;flex:1}
.play{margin-top:6px;align-self:flex-start;background:var(--coral);color:var(--onCoral);border:0;border-radius:9px;
  padding:9px 15px;font-weight:650;font-size:14px;cursor:pointer}
.play:hover{background:var(--coral2)}

/* player shell */
.player{display:grid;grid-template-columns:236px 1fr;gap:26px;margin-top:24px;align-items:start}
.rail{position:sticky;top:20px}
.railTitle{font-family:var(--serif);font-size:17px;margin:0 0 2px}
.railKicker{color:var(--mute);font-size:12.5px;margin:0 0 16px}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{position:relative;padding:0 0 16px 24px;color:var(--mute);font-size:13.5px}

  border:1.5px solid var(--line);background:var(--deep)}

ol.steps li.done:before{background:var(--teal);border-color:var(--teal)}

.eyebrow .dot{width:6px;height:6px;background:var(--coral);transform:rotate(45deg)}
.stitle{font-family:var(--serif);font-size:29px;line-height:1.22;margin:0 0 12px;font-weight:600}
.stext{font-size:17.5px;color:var(--body);margin:0 0 18px;max-width:68ch;line-height:1.6}
.stext.narr{font-family:var(--serif);font-size:19.5px;line-height:1.62}
.media{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 16px}
.media a{display:inline-flex;align-items:center;gap:7px;font-size:13px;text-decoration:none;color:var(--ink);
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
.media a:hover{border-color:var(--lav)}
.media .mk{font-size:11px;color:var(--deep);background:var(--lav);border-radius:4px;padding:1px 6px;font-weight:650}

  font-size:12.5px;font-weight:700}

.crit{transition:opacity .25s ease}

.choice .k{flex:none;width:25px;height:25px;border-radius:6px;background:var(--surf2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--lav)}
.choice .lb{font-size:16.5px;font-weight:560;line-height:1.4}
.choice .sb{font-size:14px;color:var(--mute);margin-top:3px}

  border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-family:inherit;font-size:16.5px;line-height:1.55;resize:vertical}

.crit .mk{flex:none;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px}
.crit.met{color:var(--ink);border-color:var(--teal)}
.crit.met .mk{background:var(--teal);border-color:var(--teal)}
.cont,.primary{margin-top:16px;background:var(--coral);color:var(--onCoral);border:0;border-radius:9px;
  padding:11px 19px;font-weight:650;font-size:15px;cursor:pointer}

.ghost{margin-top:16px;margin-left:9px;background:none;border:1px solid var(--line);color:var(--ink);

.moral{font-family:var(--serif);font-size:23px;font-style:italic;color:var(--gold);margin:0 0 14px;max-width:60ch}

.stext,.lesson,.prompt,.vpq,.moral,.aifb,.ctx .bit,.revealed li span:last-child{white-space:pre-line}

u.ul{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;color:inherit}
strong{font-weight:700;color:var(--ink)}

.b-pc{display:flex;gap:10px;align-items:flex-start;min-width:0}
.b-pc b{display:block;font-family:var(--serif);font-size:17px;font-weight:600}

.mb{list-style:none;margin:12px 0 0;padding:0;max-width:760px;display:flex;flex-direction:column;gap:8px}

  for(i=0;i<L.length;i++){var ln=L[i];
    if((m=ln.match(BUL))){endText();if(!cur||cur.k!=='ul'){cur={k:'ul',items:[]};parts.push(cur);}cur.items.push(m[1]);continue;}
    if((m=ln.match(NUM))){endText();if(!cur||cur.k!=='ol'){cur={k:'ol',start:+m[1],items:[]};parts.push(cur);}cur.items.push(m[2]);continue;}
    if(!ln.trim()&&cur){for(j=i+1;j<L.length&&!L[j].trim();j++);
      if(j<L.length&&(cur.k==='ul'?BUL:NUM).test(L[j])){i=j-1;continue;}}
    cur=null;txt.push(ln);}
  endText();
  return parts.map(function(p){if(p.t!==undefined)return inl(p.t.replace(/^\n+|\n+$/g,''));
    return '<'+p.k+' class="fl"'+(p.k==='ol'&&p.start!==1?' start="'+p.start+'"':'')+'>'+
      p.items.map(function(x){return '<li>'+inl(x)+'</li>';}).join('')+'</'+p.k+'>';}).join('');}
function scenarios(){return DATA.scenarios||[];}
function byId(id){var a=scenarios(),i;for(i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}

stepsEl.addEventListener('click',function(e){var li=e.target.closest&&e.target.closest('li[data-step]');if(li)jumpStep(+li.getAttribute('data-step'));});
stepsEl.addEventListener('keydown',function(e){var li=e.target.closest&&e.target.closest('li[data-step]');if(li&&(e.key==='Enter'||e.key===' ')){e.preventDefault();jumpStep(+li.getAttribute('data-step'));}});

/* Swanubhava tagging: 'anchor' (preferred) or the older 'competency' field; the pillar is derived from the anchor unless given */
var PILLAR_OF={'acts with integrity under pressure':'Individual posture',"embodies a learner's mindset":'Individual posture',
 'strives for clarity and outcomes':'Boundary defining posture','challenges assumptions, reframes and holds a point of view':'Boundary defining posture','converts insight into owned outcomes':'Boundary defining posture',
 'builds trust and psychological safety':'Collaboration posture','stays present and grounded under ambiguity':'Collaboration posture','listens beyond the ask to uncover the need':'Collaboration posture'};
function anchorOf(s){return s.anchor||s.competency||'';}
function pillarOf(s){return s.pillar||PILLAR_OF[String(anchorOf(s)).trim().toLowerCase()]||'';}
/* ---------------------------- run ---------------------------- */
function start(id){
  var s=byId(id);if(!s)return;
  S={sc:id,node:null,chips:{},log:[],disabled:{},ending:null,story:[],tries:{},hist:[],here:null,inCq:null};
  document.getElementById('railTitle').textContent=s.title;
  document.getElementById('railKicker').textContent=
    anchorOf(s)?(anchorOf(s)+(s.kicker?' - '+s.kicker:'')):(s.kicker||'');
  hubEl.classList.add('hidden');playerEl.classList.remove('hidden');window.scrollTo(0,0);
  goTo(s.start);
}
function curStep(){
  var s=byId(S.sc),n=S.ending||(s.nodes||{})[S.node];
  return n&&typeof n.step==='number'?n.step:0;
}
function renderSteps(){
  var s=byId(S.sc),cur=curStep();stepsEl.innerHTML='';
  (s.steps||[]).forEach(function(label,i){
    var cls=i<cur?'done':(i===cur?'now':'');
    var chip=S.chips[i]?'<span class="chip">'+esc(S.chips[i])+'</span>':'';
    stepsEl.appendChild(el('<li class="'+cls+'"'+(isTrainer()?' data-step="'+i+'" tabindex="0" title="Jump to this step"':'')+'>'+esc(label)+chip+'</li>'));
  });
  stepsEl.classList.toggle('jump',isTrainer());navState();
}
/* trainer navigation: remember each screen so Back can return to it, and let a step jump straight to its first screen */
function remember2(){if(S.here)S.hist.push({id:S.here,log:S.hereLog||0,chips:S.hereChips||{}});}
function navState(){var b=document.getElementById('navBack');if(!b)return;b.classList.toggle('hidden',!isTrainer());
  b.disabled=!(S.inCq||(S.hist&&S.hist.length));}
function goBack(){if(!isTrainer())return;
  if(S.inCq){var c=S.inCq;S.log.length=c.log;S.chips=c.chips;S.inCq=null;S.here=null;S.navigating=1;goTo(c.node);S.navigating=0;return;}
  var p=S.hist.pop();if(!p)return;S.log.length=p.log;S.chips=p.chips;if(S.tries)S.tries[p.id]=0;if(S.disabled)S.disabled[p.id]=[];
  S.here=null;S.navigating=1;goTo(p.id);S.navigating=0;}
function firstOfStep(i){var s=byId(S.sc),nodes=s.nodes||{},ends=s.endings||{},seen={},q=[s.start],hit=null;
  while(q.length&&!hit){var id=q.shift();if(seen[id])continue;seen[id]=1;var n=nodes[id]||ends[id];if(!n)continue;
    if(n.step===i){hit=id;break;}
    [n.to,n.toPass,n.toFail].concat((n.choices||[]).map(function(c){return c.to||n.to;})).forEach(function(x){if(x&&!seen[x])q.push(x);});}
  if(!hit)Object.keys(nodes).concat(Object.keys(ends)).forEach(function(k){var n=nodes[k]||ends[k];if(!hit&&n.step===i)hit=k;});
  return hit;}
function jumpStep(i){if(!isTrainer())return;var id=firstOfStep(i);if(!id)return;S.inCq=null;goTo(id);}
function goTo(nodeId){
  var s=byId(S.sc),n=(s.nodes||{})[nodeId];
  if(!S.navigating&&S.here!==nodeId)remember2();
  if(S.here!==nodeId||S.navigating){S.hereLog=S.log.length;S.hereChips=JSON.parse(JSON.stringify(S.chips||{}));}S.here=nodeId;S.inCq=null;
  if(!n){ var e=(s.endings||{})[nodeId]; if(e){return showEnding(nodeId,e);} 
    stageEl.innerHTML='<p class="stext">Missing node: '+esc(nodeId)+'</p>';return;}
  S.node=nodeId;S.ending=null;renderSteps();
  if(n.type==='narrative')return renderNarrative(n);
  if(n.type==='choice')return renderChoice(n,nodeId);
  if(n.type==='multi')return renderMulti(n,nodeId);
  if(n.type==='evaluate')return renderEvaluate(n,nodeId);
  stageEl.innerHTML='<p class="stext">Unknown node type: '+esc(n.type)+'</p>';
}
function mediaHTML(m){

    return '<a href="'+esc(x.url)+'" target="_blank" rel="noopener"><span class="mk">'+
      esc((x.type||'link').toUpperCase())+'</span>'+esc(x.label||x.url)+'</a>';}).join('')+'</div>';
}
function affBar(n,rubricCount){

  if(contextBits(n).length)b+='<button data-aff="i" title="Background so far">Briefing</button>';
  if(rubricCount)b+='<button data-aff="e" id="eBtn" title="Evaluation rubric">Rubric</button>';
  return b?'<div class="aff">'+b+'</div>':'';
}
function contextBits(n){
  var bits=S.story.slice();
  (n.context||[]).forEach(function(c){bits.push({label:c.label||'Note',text:c.text});});
  return bits;
}
function ctxHTML(n){
  var bits=contextBits(n);
  return '<div class="ctx hidden" id="ctxPanel"><h4>Where you are</h4>'+
    bits.map(function(b){return '<div class="bit"><b>'+esc(b.label)+'</b>'+fmt(b.text)+'</div>';}).join('')+'</div>';
}
function wireAff(n){
  var bar=stageEl.querySelector('.aff');if(!bar)return;
  Array.prototype.forEach.call(bar.querySelectorAll('button'),function(b){
    b.addEventListener('click',function(){

function attr(s){return esc(s).replace(/"/g,'&quot;');}
function artHTML(n,k){var s=byId(S.sc)||{};
  if(n&&n.sceneImg)return '<div class="scene img fade"><img src="'+attr(n.sceneImg)+'" alt="'+attr(n.sceneAlt||'')+'"></div>';
  if(k==='none'||s.hideArt)return '';

function stageOut(n,body,extraScene,headHTML){

    '<div class="phead">'+(n.title?'<h2 class="stitle">'+esc(n.title)+'</h2>':'<span style="flex:1"></span>')+

/* v0.3 trainer view helpers */
function isTrainer(){return false;}  /* trainee edition: no trainer view */
function tnoteHTML(n){return isTrainer()&&n&&n.trainerNote?'<div class="tnote"><b>For the trainer</b>'+esc(n.trainerNote)+'</div>':'';}
function choiceGood(n,c){var any=(n.choices||[]).some(function(x){return x.consequence&&x.consequence.good;});
  if(c.consequence&&c.consequence.good)return true;if(any)return false;if(n.gate)return c.correct!==false;return null;}
function tsubChoice(n,c){if(!isTrainer())return '';var g=choiceGood(n,c);
  var tag=g===true?'<span class="tg good">Expert move</span>':g===false?'<span class="tg trap">Trap</span>':'';
  var t=[c.reveals?'Reveals: '+c.reveals:'',c.trainerNote||''].filter(Boolean).join('\n');
  return (tag||t)?'<span class="tsub">'+tag+esc(t)+'</span>':'';}
function tsubOpt(n,o,i){if(!isTrainer())return '';var need=(n.correct||[]).indexOf(i)>-1;
  var t=[o.reveals?'Reveals: '+o.reveals:'',o.why?'Why: '+o.why:'',o.trainerNote||''].filter(Boolean).join('\n');
  return '<span class="tsub"><span class="tg '+(need?'good':'trap')+'">'+(need?'Must pick':'Leave out')+'</span>'+esc(t)+'</span>';}

/* visual blocks */
var AVC=['var(--teal)','var(--coral)','var(--gold)','var(--lav)'];
function blocksOf(n,at){return ((n&&n.blocks)||[]).filter(function(b){return (b.at||'top')===at;});}
function initials(s){return String(s||'?').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w.charAt(0).toUpperCase();}).join('');}
function blockHTML(b){
  if(b.type==='post'){var r=b.reply||{};
    return '<figure class="blk post"><div class="b-h"><span class="b-av" style="background:'+AVC[0]+'">'+esc(initials(b.author))+'</span><span><b>'+esc(b.author||'')+'</b>'+
      (b.handle?'<span class="b-hd">'+esc(b.handle)+'</span>':'')+(b.meta?'<span class="b-hd">'+esc(b.meta)+'</span>':'')+'</span></div>'+
      (b.text?'<div class="b-t">'+fmt(b.text)+'</div>':'')+
      (r.text?'<div class="b-shot"><div class="b-sl">'+esc(r.from||'Reply')+'</div><p>'+esc(r.text)+'</p>'+(r.link?'<span class="b-lk">'+esc(r.link)+'</span>':'')+'</div>':'')+
      (b.after?'<p class="b-t">'+esc(b.after)+'</p>':'')+(b.stats?'<div class="b-st">'+esc(b.stats)+'</div>':'')+'</figure>';}
  if(b.type==='people')
    return '<figure class="blk people">'+(b.title?'<p class="b-cap">'+esc(b.title)+'</p>':'')+'<div class="b-pg">'+(b.people||[]).map(function(p,i){
      return '<div class="b-pc"><span class="b-av" style="background:'+AVC[i%AVC.length]+'">'+esc(initials(p.name))+'</span><div><b>'+esc(p.name||'')+'</b>'+
        (p.role?'<span class="b-rl">'+esc(p.role)+'</span>':'')+(p.lines?'<p>'+esc(p.lines)+'</p>':'')+'</div></div>';}).join('')+'</div></figure>';
  if(b.type==='image'){var src=String(b.src||''),ok=/^(https:\/\/|data:image\/)/.test(src);
    return '<figure class="blk img">'+(ok?'<img src="'+esc(src)+'" alt="'+esc(b.alt||'')+'">':'<div class="b-ph"><b>Image to come</b>'+esc(b.alt||'')+'</div>')+
      (b.caption?'<p class="b-cap">'+esc(b.caption)+'</p>':'')+'</figure>';}
  return '';
}
function blocksHTML(n,at){return blocksOf(n,at).map(blockHTML).join('');}
function blockText(b){
  if(b.type==='post')return [b.author?b.author+(b.meta?' ('+b.meta+')':'')+':':'',b.text,b.reply&&b.reply.text?(b.reply.from||'Reply')+': '+b.reply.text:'',b.after,b.stats].filter(Boolean).join('\n');
  if(b.type==='people')return (b.people||[]).map(function(p){return p.name+(p.role?', '+p.role:'')+(p.lines?'. '+p.lines:'');}).join('\n');
  if(b.type==='image')return b.caption||'';
  return '';
}
/* the i panel keeps what blocks said, so a learner can reread a post while writing */
function withBlocks(n,text){
  return blocksOf(n,'top').map(blockText).concat([text||''],blocksOf(n,'bottom').map(blockText)).filter(Boolean).join('\n\n');
}

/* narrative */
function remember(label,text){
  if(!text)return;
  for(var i=0;i<S.story.length;i++)if(S.story[i].text===text)return;
  S.story.push({label:label||'Earlier',text:text});
}
function renderNarrative(n){
  remember(n.title||n.eyebrow||'Earlier',withBlocks(n,n.text));
  stageOut(n,blocksHTML(n,'top')+(n.text?'<div class="stext narr">'+fmt(n.text)+'</div>':'')+blocksHTML(n,'bottom')+mediaHTML(n.media)+
    '<button class="cont" id="go">Continue &rarr;</button>');
  document.getElementById('go').addEventListener('click',function(){goTo(n.to);});
}

/* choice */
function renderChoice(n,nodeId){
  var dis=S.disabled[nodeId]||[];
  var body='<div class="phead"><div class="prompt">'+fmt(n.prompt)+'</div>'+affBar(n,0)+'</div>'+
    ctxHTML(n)+mediaHTML(n.media)+'<div class="choices">'+
    n.choices.map(function(c,i){
      return '<button class="choice" data-i="'+i+'"'+(dis.indexOf(i)>-1?' disabled':'')+'>'+
        '<span class="k">'+esc(c.k||String.fromCharCode(65+i))+'</span><span><span class="lb">'+
        esc(c.label)+'</span>'+(c.sub?'<span class="sb">'+esc(c.sub)+'</span>':'')+tsubChoice(n,c)+'</span></button>';
    }).join('')+'</div>';
  stageOut(n,body);wireAff(n);
  Array.prototype.forEach.call(stageEl.querySelectorAll('.choice'),function(b){
    b.addEventListener('click',function(){choose(n,nodeId,+b.getAttribute('data-i'));});
  });
}
function choose(n,nodeId,i){
  var logBefore=S.log.length,chipsBefore=JSON.parse(JSON.stringify(S.chips||{}));
  var c=n.choices[i];
  S.log.push({node:nodeId,kind:'choice',i:i,pick:c.k||String.fromCharCode(65+i),
    label:c.label,tag:c.tag||c.label,gated:!!(n.gate&&c.correct===false)});
  if(n.gate&&c.correct===false){
    S.disabled[nodeId]=(S.disabled[nodeId]||[]).concat([i]);
    renderChoice(n,nodeId);
    var p=stageEl.querySelector('.choices');
    p.parentNode.insertBefore(el('<div class="lesson"><b>Not yet</b>'+fmt(c.lesson||c.note||'')+'</div>'),p);
    return;
  }
  if(typeof n.step==='number'&&c.chip)S.chips[n.step]=c.chip;
  var cq=c.consequence;
  if(!cq)return goTo(c.to||n.to);
  S.inCq={node:nodeId,log:logBefore,chips:chipsBefore};navState();
  remember(cq.title||'What happened',withBlocks(cq,cq.text));
  stageOut({scene:cq.scene||n.scene,sceneImg:cq.sceneImg||(cq.scene?'':n.sceneImg),title:cq.title,eyebrow:cq.eyebrow,trainerNote:cq.trainerNote},
    blocksHTML(cq,'top')+'<div class="stext">'+fmt(cq.text)+'</div>'+blocksHTML(cq,'bottom')+
    (cq.lesson?'<div class="lesson'+(cq.good?' good':'')+'"><b>'+(cq.good?'Why this worked':'What this cost you')+'</b>'+fmt(cq.lesson)+'</div>':'')+
    '<button class="cont" id="go">Continue &rarr;</button>');
  document.getElementById('go').addEventListener('click',function(){goTo(c.to||n.to);});
}

/* multi-select, rules-based */
function renderMulti(n,nodeId){
  var body='<div class="phead"><div class="prompt">'+fmt(n.prompt)+'</div>'+affBar(n,0)+'</div>'+
    ctxHTML(n)+mediaHTML(n.media)+
    '<div id="opts">'+n.options.map(function(o,i){
      return '<label class="opt"><input type="checkbox" value="'+i+'"><span>'+esc(o.label)+
        (o.sub?'<span class="sb">'+esc(o.sub)+'</span>':'')+tsubOpt(n,o,i)+'</span></label>';}).join('')+'</div>'+
    '<button class="primary" id="sub">Submit</button><div id="fb"></div>';
  stageOut(n,body);wireAff(n);
  Array.prototype.forEach.call(stageEl.querySelectorAll('.opt input'),function(cb){
    cb.addEventListener('change',function(){cb.parentNode.classList.toggle('sel',cb.checked);});
  });
  document.getElementById('sub').addEventListener('click',function(){
    var picked=[];Array.prototype.forEach.call(stageEl.querySelectorAll('.opt input'),function(cb){
      if(cb.checked)picked.push(+cb.value);});
    var need=n.correct||[],hit=0,extra=0;
    picked.forEach(function(i){need.indexOf(i)>-1?hit++:extra++;});
    var ok=hit===need.length&&extra===0;
    var miss=need.filter(function(i){return picked.indexOf(i)<0;})
      .map(function(i){return n.options[i].label;});
    S.log.push({node:nodeId,kind:'multi',sel:picked.slice(),pick:picked.join('+'),score:hit+'/'+need.length,
      missed:miss.slice(),extras:extra});
    var fb=document.getElementById('fb');
    /* name what was missed and what was picked that does not belong; an option's optional 'why' explains it */
    var withWhy=function(i){var o=n.options[i];return o.label+(o.why?' - '+o.why:'');};
    var missW=need.filter(function(i){return picked.indexOf(i)<0;}).map(withWhy);
    var extraW=picked.filter(function(i){return need.indexOf(i)<0;}).map(withWhy);
    var head=ok?'Complete':missW.length?'Partial - '+hit+' of '+need.length:
      'All '+need.length+' that matter - plus '+extra+' that do'+(extra===1?'es':'')+' not';
    var body=ok?(n.successNote||'Every one that mattered, and nothing that did not.'):
      [missW.length?(n.missNote||'Still missing: ')+missW.join('; '):'',
       extraW.length?(n.extraNote||(extraW.length===1?'This one does not belong: ':'These do not belong: '))+extraW.join('; '):''
      ].filter(Boolean).join('\n\n');
    /* when the author wrote a 'why' on any option, show every option with what the learner did and why */
    var hasWhy=n.options.some(function(o){return !!o.why;});
    var MB={hit:'You picked it - it matters',miss:'You missed this one - it matters',wrong:'You picked it - it does not belong',skip:'Rightly left out'};
    var breakdown=hasWhy?'<ul class="mb">'+n.options.map(function(o,i){
        var isNeed=need.indexOf(i)>-1,isPick=picked.indexOf(i)>-1,st=isNeed?(isPick?'hit':'miss'):(isPick?'wrong':'skip');
        return '<li class="'+st+'"><div class="mbh"><span class="mbt">'+MB[st]+'</span><span>'+esc(o.label)+'</span></div>'+
          (o.why?'<p class="why">'+esc(o.why)+'</p>':'')+'</li>';}).join('')+'</ul>':'';
    if(hasWhy&&!ok)body=missW.length&&extraW.length?'You missed some that matter and picked some that do not. Each one is below, with why.':
      missW.length?'You missed '+(missW.length===1?'one that matters':missW.length+' that matter')+'. Each one is below, with why.':
      'You picked '+(extraW.length===1?'one that does not belong':extraW.length+' that do not belong')+'. Each one is below, with why.';
    fb.innerHTML='<div class="lesson'+(ok?' good':'')+'" style="margin-top:16px"><b>'+esc(head)+'</b>'+esc(body)+'</div>'+breakdown+
      '<button class="cont" id="go">Continue &rarr;</button>';
    document.getElementById('sub').disabled=true;
    Array.prototype.forEach.call(stageEl.querySelectorAll('.opt input'),function(cb){cb.disabled=true;});
    document.getElementById('go').addEventListener('click',function(){goTo(n.to);});
  });
}

/* free text, rubric-graded */
function evaluateAnswer(text,criteria){
  var t=(' '+String(text).toLowerCase()+' ').replace(/[^a-z0-9\s]/g,' ');
  var met=criteria.map(function(c){
    return (c.keywords||[]).some(function(k){return t.indexOf(' '+k.toLowerCase()+' ')>-1||t.indexOf(k.toLowerCase())>-1;});
  });
  return {met:met,score:met.filter(Boolean).length};
}
function coachList(n,met){
  return n.criteria.filter(function(c,i){return !met[i];})
    .map(function(c){return c.coach||c.hint||c.label;});
}
function joinCoach(a){
  if(a.length===1)return a[0];
  return a.slice(0,-1).join('; ')+'; and '+a[a.length-1];
}
/* redFlags: a talking point for the facilitator. Shown inside the folded rubric (press e), never graded. */
function redFlagsOf(n){
  var r=n.redFlags;if(!r)return null;
  if(Array.isArray(r))r={phrases:r};
  return {rule:r.rule||'',phrases:r.phrases||[]};
}
function redLineHTML(n){
  var r=redFlagsOf(n);if(!r||(!r.rule&&!r.phrases.length))return '';
  return '<div class="redline"><b>Red line - for discussion, not graded</b>'+esc(r.rule)+
    (r.phrases.length?'<div>'+r.phrases.map(function(p){return '<span class="rlp">'+esc(p)+'</span>';}).join('')+'</div>':'')+'</div>';
}
function maxTries(n){var m=parseInt(n.tries||DATA.tries||3,10);return m>0?m:3;}
function renderEvaluate(n,nodeId){
  var expand=n.showRubric===true||isTrainer();
  var tries=S.tries[nodeId]||0,max=maxTries(n);
  S.drafts=S.drafts||{};
  var ask=n.speaker
    ? '<div class="vpq"><b>'+esc(n.speaker)+'</b>&ldquo;'+fmt(n.question||n.prompt)+'&rdquo;</div>'
    : '<div class="prompt">'+fmt(n.question||n.prompt)+'</div>';
  var head=n.speaker
    ? '<div class="phead"><span style="flex:1"></span>'+affBar(n,n.criteria.length)+'</div>'+ask
    : '<div class="phead">'+ask+affBar(n,n.criteria.length)+'</div>';
  var body=head+ctxHTML(n)+mediaHTML(n.media)+
    '<textarea id="ans" placeholder="'+esc(n.placeholder||'Write your answer. Two or three sentences is enough.')+'">'+esc(S.drafts[nodeId]||'')+'</textarea>'+
    '<div class="rubwrap"><div class="rlab" id="rlab">'+n.criteria.length+' criteria - tap Rubric to show them</div>'+
    '<div class="rubric'+(expand?'':' folded')+'" id="rub">'+n.criteria.map(function(c){
      return '<div class="crit"><span class="mk"></span><span>'+esc(c.label)+'</span></div>';}).join('')+redLineHTML(n)+'</div></div>'+
    '<div class="linkrow"><button class="primary" id="sub" style="margin-top:0">Submit for grading'+(max>1?' (attempt '+(tries+1)+' of '+max+')':'')+'</button>'+
    (n.model&&isTrainer()?'<button class="linkbtn" id="modelBtn">Show me a model answer</button>':'')+'</div>'+
    '<div id="fb"></div>';
  stageOut({scene:n.scene,sceneImg:n.sceneImg,eyebrow:n.eyebrow,title:n.title,trainerNote:n.trainerNote},body);
  wireAff(n);
  if(expand){var eb=document.getElementById('eBtn');if(eb)eb.classList.add('on');}
  if(tries)document.getElementById('rlab').textContent=
    'Attempt '+(tries+1)+' of '+max+' - '+n.criteria.length+' criteria, tap Rubric to show them';

  var mb=document.getElementById('modelBtn');
  if(mb)mb.addEventListener('click',function(){
    S.usedModel=S.usedModel||{};S.usedModel[nodeId]=1;document.getElementById('ans').value=n.model;
    document.getElementById('fb').innerHTML='<div class="aibox fade"><div class="alab">Model answer loaded</div>'+
      '<div class="aifb">'+(n.modelExplain||'This covers every rubric criterion. Edit it or submit it as it stands to see the grade.')+'</div></div>';
    document.getElementById('ans').focus();
  });

  document.getElementById('sub').addEventListener('click',function(){
    var txt=document.getElementById('ans').value.trim();
    if(txt.length<12){document.getElementById('fb').innerHTML=
      '<div class="aibox fade"><div class="alab" style="color:var(--coral)">Write a reply first</div>'+
      '<div class="aifb">Give it a real answer, even one sentence, and it will be graded against the rubric.</div></div>';return;}
    S.tries[nodeId]=(S.tries[nodeId]||0)+1;S.drafts[nodeId]=txt;
    document.getElementById('sub').disabled=true;
    document.getElementById('fb').innerHTML=
      '<div class="aibox fade"><div class="alab"><span class="spin"></span>Evaluating your answer</div></div>';
    var d=REDUCE?0:GRADE_DELAY;
    if(d)setTimeout(function(){revealGrade(n,nodeId,txt);},d);
    else revealGrade(n,nodeId,txt);
  });
}
function revealGrade(n,nodeId,txt){
  var res=evaluateAnswer(txt,n.criteria),total=n.criteria.length;
  var crits=stageEl.querySelectorAll('.crit');
  var anim=!REDUCE&&GRADE_DELAY>0;
  res.met.forEach(function(m,i){
    if(!m)return;
    if(!anim){crits[i].classList.add('met');return;}
    crits[i].style.opacity='.35';
    setTimeout(function(){crits[i].classList.add('met');crits[i].style.opacity='';},130*i+120);
  });
  var pass=res.score>=(n.pass||total);
  var tries=S.tries[nodeId],left=Math.max(0,maxTries(n)-tries),miss=total-res.score;
  if(typeof n.step==='number')S.chips[n.step]=res.score+'/'+total;
  document.getElementById('rlab').textContent=
    res.score+' of '+total+' criteria met - tap Rubric to see which';

  var fb;
  if(pass){fb=n.passNote||'Every criterion covered.';}
  else{
    fb='<b>You met '+res.score+' of '+total+' rubric points - '+miss+' missed.</b> '+
      (n.coachLead||'To make this land, ')+joinCoach(coachList(n,res.met))+'.'+
      '<span class="tleft">'+(left?'You have '+left+' more attempt'+(left>1?'s':'')+'. Improve it, or submit it as it is - your last submitted answer is the one that counts.':
        'That was your last attempt, so this answer is the one that counts.')+'</span>';
  }
  var box=document.getElementById('fb').querySelector('.aibox');
  box.innerHTML='<div class="alab"><span class="scorepill'+(pass?' full':'')+'">'+res.score+' / '+total+'</span>'+
    'Rubric evaluation</div><div class="aifb">'+fb+'</div>'+
    '<div class="linkrow">'+
    (pass?'<button class="primary" id="go" style="margin-top:0">See how it lands</button>':
     left?'<button class="primary" id="retry" style="margin-top:0">Improve my answer</button><button class="linkbtn" id="go">Submit as is</button>':
     '<button class="primary" id="go" style="margin-top:0">Continue</button>')+'</div>';

  if(!S.log.some(function(l){return l.node===nodeId&&l.kind==='written';}))
    S.log.push({node:nodeId,kind:'written',pick:'written',score:res.score+'/'+total,
      missed:coachShort(n,res.met),answer:txt,met:res.met.slice(),tries:tries});
  else S.log.forEach(function(l){if(l.node===nodeId&&l.kind==='written'){
      l.score=res.score+'/'+total;l.missed=coachShort(n,res.met);l.answer=txt;l.tries=tries;l.met=res.met.slice();}});

  var g=document.getElementById('go');
  if(g)g.addEventListener('click',function(){goTo(pass?(n.toPass||n.to):(n.toFail||n.to));});
  var r=document.getElementById('retry');
  if(r)r.addEventListener('click',function(){renderEvaluate(n,nodeId);});
}
function coachShort(n,met){
  return n.criteria.filter(function(c,i){return !met[i];}).map(function(c){return c.hint||c.label;});
}

/* ending */
function showEnding(key,e){
  S.ending=e;S.node=null;renderSteps();
  var rev=(e.revealed||[]).map(function(p){
    return '<li><span>'+esc(p[0])+'</span><span>'+esc(p[1])+'</span></li>';}).join('');
  stageOut(e,
    ctxHTML(e)+
    (e.moral?'<p class="moral">'+inl(e.moral)+'</p>':'')+
    blocksHTML(e,'top')+'<div class="stext">'+fmt(e.verdict||'')+'</div>'+blocksHTML(e,'bottom')+
    (rev?'<ul class="revealed">'+rev+'</ul>':'')+
    mediaHTML(e.media)+
    '<details class="pathbox"><summary>See your path - every decision and what it led to</summary>'+pathHTML(key,e)+'</details>'+
    sendHTML()+
    '<button class="ghost" id="again" style="margin-left:0">Run it again</button>',null,affBar(e,0));
  wireAff(e);wireSend(key,e);
  document.getElementById('again').addEventListener('click',function(){start(S.sc);});
}
function list(a){
  if(!a||!a.length)return '';
  return a.length===1?a[0]:a.slice(0,-1).join(', ')+' and '+a[a.length-1];
}
function sessionSummary(endKey,e){
  var s=byId(S.sc),L=[];
  L.push(s.title+(s.kicker?' - '+s.kicker:''));
  if(anchorOf(s))L.push('Anchor: '+anchorOf(s)+(s.behaviour?' - '+s.behaviour:''));
  if(pillarOf(s))L.push('Pillar: '+pillarOf(s));
  var retries=S.log.filter(function(l){return l.gated;}).length;
  S.log.filter(function(l){return !l.gated;}).forEach(function(l){
    if(l.kind==='choice')L.push('Chose: '+l.label);
    if(l.kind==='multi')L.push('Gap check: '+l.score+' of the must-haves'+
      (l.missed&&l.missed.length?', missed '+list(l.missed):'')+
      (l.extras?' (and '+l.extras+' that did not matter)':''));
    if(l.kind==='written')L.push('Written answer: '+l.score+' rubric criteria'+
      (l.missed&&l.missed.length?', short on '+list(l.missed):' - full marks'));
  });
  if(retries)L.push('Corrected course after '+retries+' wrong turn'+(retries>1?'s':''));
  L.push('Ending: '+((e&&e.title)||endKey));
  var picks=S.log.map(function(l){return l.pick+(l.score?'('+l.score+')':'');}).join('>');
  L.push('PUP|'+s.id+'|'+(anchorOf(s)||'-')+'|'+picks+'|'+endKey);
  return L.join('\n');
}

function b64(s){try{return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(x){return '';}}

      if(l.kind==='choice')return {k:'c',n:l.node,i:l.i,g:l.gated?1:0};
      if(l.kind==='multi')return {k:'m',n:l.node,sel:l.sel||[]};
      if(l.kind==='written')return {k:'w',n:l.node,met:(l.met||[]).map(function(x){return x?1:0;}),tr:l.tries||1,
        mu:(S.usedModel&&S.usedModel[l.node])?1:0,a:l.answer||''};
      return null;}).filter(Boolean)};}
function resultCode(endKey,name){return 'PUP2:'+b64(JSON.stringify(resultObj(endKey,name)));}

function copyText(t,done){var fb=function(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(x){}document.body.removeChild(ta);done();};

function wireSend(endKey,e){var to=DATA.sendTo||{},inp=document.getElementById('lname');if(!inp)return;

function cut(t,n){t=String(t||'').replace(/\s+/g,' ').trim();if(t.length<=n)return t;var c=t.slice(0,n),i=c.lastIndexOf('. ');
  return i>60?c.slice(0,i+1):c.replace(/\s\S*$/,'')+' ...';}
function stepLabel(s,n,i){var l=typeof n.step==='number'&&s.steps?s.steps[n.step]:'';return l||('Step '+(i+1));}
/* group the log by node, in the order the learner met them; gated wrong picks become 'tried first' */
function pathGroups(){var s=byId(S.sc),g=[],at={};
  S.log.forEach(function(l){var k=l.node+'|'+l.kind;if(!(k in at)){at[k]=g.length;g.push({node:l.node,kind:l.kind,n:(s.nodes||{})[l.node]||{},tried:[],l:null});}
    var x=g[at[k]];if(l.gated)x.tried.push(l.i);else x.l=l;});
  return g.filter(function(x){return x.l;});}
function goodIdx(n){var r=-1;(n.choices||[]).forEach(function(c,i){if(r<0&&choiceGood(n,c)===true)r=i;});return r;}

  var rev=(e&&e.revealed||[]).map(function(p){return '<li><b>'+esc(p[0])+':</b> '+esc(p[1])+'</li>';}).join('');
  var css=':root{--teal:#0E7C6B;--line:#CFDDEC;--surface:#F4F8FC;--deep:#FFFFFF;--ink:#10233B;--mute:#5C7288;--body:#22364F}'+
    'body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:720px;margin:32px auto;padding:0 18px;color:#10233B;line-height:1.55;background:#fff}'+
    'h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:30px 0 10px;border-bottom:1px solid #CFDDEC;padding-bottom:6px}h3{font-size:16px;margin:24px 0 6px}'+
    '.m{color:#5C7288;margin:0 0 6px}.sit{color:#22364F;background:#F4F8FC;border-radius:8px;padding:10px 12px;white-space:pre-line}'+
    '.cq{border-left:4px solid #6B6F8A;padding:6px 14px;margin:10px 0;background:#FAFBFD}.cq.good{border-left-color:#0E7C6B}.cq.trap{border-left-color:#E4613F}'+
    '.cq p,.tx{margin:2px 0 8px;white-space:pre-line}.fl{white-space:normal;margin:6px 0 10px;padding-left:22px}u.ul{text-underline-offset:3px}.alt{color:#0E7C6B}blockquote{margin:6px 0;padding:8px 14px;border-left:3px solid #CFDDEC;white-space:pre-line;color:#22364F}'+
    '.ms{padding-left:18px}.ms li{margin:6px 0}.mk{font-size:13px;color:#5C7288}details{margin:10px 0}summary{cursor:pointer;font-weight:600}'+
    '.e{border:2px solid #10233B;border-radius:10px;padding:10px 16px;margin:20px 0}.e p{white-space:pre-line}'+
    '@media print{.pth .pa{height:12px}}'+PATHCSS;
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+
    esc(s.title)+' - my report</title><style>'+css+'</style></head><body><h1>'+esc(s.title)+'</h1><p class="m">'+
    esc(name||'')+(name?' - ':'')+esc(new Date().toLocaleDateString())+'</p>'+
    (anchorOf(s)?'<p class="m">'+esc(anchorOf(s))+(s.behaviour?' - '+esc(s.behaviour):'')+'</p>':'')+
    '<h2>Your path</h2>'+pathHTML(endKey,e)+'<h2>Step by step</h2>'+sec.join('')+
    '<h2>How it ended</h2><div class="e"><b>'+esc((e&&e.title)||endKey)+'</b>'+(e&&e.moral?'<p><i>'+esc(e.moral)+'</i></p>':'')+
    '<div class="tx">'+fmt((e&&e.verdict)||'')+'</div>'+(rev?'<ul>'+rev+'</ul>':'')+'</div></body></html>';}

<script type="text/plain" id="docsrc"><h2>What changed in v0.3</h2>
<ul>
<li><b>Trainee edition.</b> This public Studio builds scenarios and trainee files. 'Export for trainees' removes the trainer-only fields (<code>trainerNote</code>, <code>reveals</code>, <code>redFlags</code>), so a curious learner can't read them in the page source. The trainer view, trainer export and class dashboard are in a separate edition.</li>
<li><b>Briefing and Rubric buttons.</b> The old <b>i</b> and <b>e</b> buttons now say what they do, which matters most on a phone.</li>
<li><b>Send to trainer.</b> The last screen asks for the learner's name and sends the result by WhatsApp or email, or copies it. The learner can also save a personal report.</li>
<li><b>Learner result.</b> Paste one learner's message and see their path - every decision and what it led to - with their written answer and criteria.</li>
</ul>

<h2>How this works</h2>
<p>Left pane is content. The engine is frozen and lives inside this file. Preview runs the real engine in an iframe, so <b>what you see is byte-for-byte what exports</b>. Each export is one self-contained HTML file - offline, no dependencies, mail it to anyone.</p>
<p><code>Cmd/Ctrl + Enter</code> re-runs the preview.</p>

<h2>Scenario shape</h2>
<pre>{
  "deckTitle": "The Puppeteer",
  "sendTo": {"whatsapp":"919800000000","email":"you@example.com"},   <span class="k">// v0.3, optional - where 'Send to trainer' goes</span>
  "scenarios": [{
    "id": "signoff",              <span class="k">// slug, appears in the session code</span>
    "title": "...", "kicker": "...", "tag": "Product analysis",
    "anchor": "Challenges assumptions, reframes and holds a point of view",   <span class="k">// Swanubhava anchor this scenario trains, verbatim ('competency' still accepted)</span>
    "pillar": "Boundary defining posture",   <span class="k">// optional - derived from the anchor when left out</span>
    "behaviour": "pushes past the happy path",
    "meta": "6 min - 3 decisions", "thumb": "office",
    "blurb": "One sentence of tension.",
    "highlight": false,           <span class="k">// true = teal pill on the hub card</span>
    "steps": ["Briefing","Decision","Write it down","Debrief"],
    "start": "brief",
    "nodes": { ... },
    "endings": { ... }
  }]
}</pre>
<p>One scenario in the array and the hub is skipped - it opens straight into the run. Several, and you get a hub of cards.</p>

<h2>Node types</h2>
<p><b>narrative</b> - sets the scene, one Continue button.</p>
<pre>{"type":"narrative","step":0,"scene":"office","eyebrow":"Briefing",
 "title":"...","text":"...","media":[],"to":"n1"}</pre>

<p><b>choice</b> - the core mechanic. Each choice may carry a consequence screen before it routes on.</p>
<pre>{"type":"choice","step":1,"scene":"office","prompt":"...",
 "gate": false,                  <span class="k">// true = wrong answers disable and retry, no advance</span>
 "choices":[
   {"k":"A","label":"...","sub":"...","tag":"Signed as-is","chip":"Signed",
    "correct": false,            <span class="k">// only meaningful when gate:true</span>
    "lesson":"coaching note shown on a gated wrong answer",
    "consequence":{"scene":"storm","title":"...","text":"...",
                   "lesson":"what this cost you","good":false},
    "to":"n2"}]}</pre>
<p>A choice is the <b>expert move</b> when its consequence has <code>"good": true</code>; the others in that decision are <b>traps</b>. The learner's path diagram and report colour them that way.</p>

<p><b>multi</b> - multi-select, rules-graded against <code>correct</code> indexes. No partial credit routing; it always continues to <code>to</code>, but the feedback names what was missed.</p>
<pre>{"type":"multi","step":2,"scene":"matrix","prompt":"...",
 "options":[{"label":"...","sub":"...","why":"..."}],
 "correct":[0,1,3],
 "successNote":"...","missNote":"Before Friday you still need: ","to":"n3"}</pre>
<p>Feedback names both kinds of slip: the ones they missed (after <code>missNote</code>) and the ones they picked that do not belong (after <code>extraNote</code>, default 'This one does not belong: '). Give any option an optional <code>why</code> - one short clause - and once any option has one, the feedback after Submit lists every option with what the learner did - picked it and it matters, missed it, picked it and it does not belong, rightly left out - and its <code>why</code> underneath. <code>why</code> is shown to learners; <code>reveals</code> is not.</p>

<p><b>evaluate</b> - free text against a rubric. Criteria light up as they are met, and the grade arrives with coaching, not just a score. Routes to <code>toPass</code> or <code>toFail</code>.</p>
<pre>{"type":"evaluate","step":3,"scene":"data",
 "speaker":"The delivery lead:",       <span class="k">// renders as in-character dialogue</span>
 "question":"Write me the line...",    <span class="k">// use "prompt" instead for a plain instruction</span>
 "criteria":[{
   "label":"Names the specific channel",
   "keywords":["sms","email","in-app","sends an sms", ...],
   "hint":"say which channel fires",   <span class="k">// short - used in the session summary</span>
   "coach":"name the channel that actually fires - 'notify' is the word that let two teams build two different things"
 }],
 "pass":3,
 "coachLead":"To make this un-misreadable, ",
 "passNote":"...",
 "model":"When a refund is approved, the system sends...",
 "modelExplain":"This covers all three: it &lt;b&gt;names the channel&lt;/b&gt;...",
 "redFlags":{"rule":"Any note that blames the customer fails, however good the rest is.",
             "phrases":["should have read","her responsibility"]},   <span class="k">// optional, NOT graded, trainer only</span>
 "toPass":"good","toFail":"partial"}</pre>

<p><b>redFlags (optional).</b> A red line for the facilitator to talk about. It sits inside the folded rubric, under the criteria, so it appears only when you tap Rubric - the same reveal as the rubric. The engine never grades it: an answer containing these phrases scores exactly as it would without them. The validator only checks that the model answer does not contain one. The dashboard shows an answer that uses a phrase under 'Answers to discuss'. Red flags are trainer material, so the trainee export removes them.</p>

<p><b>Keywords: aim for 15-25 per criterion, mostly phrases.</b> Single words either fire on everything or miss how people actually write. Include contractions, partial words (<code>escalat</code> catches the whole family), and the sideways phrasings. The validator complains below 8.</p>

<p><b>coach vs hint.</b> <code>hint</code> is a fragment for the session summary. <code>coach</code> is a full sentence naming the mechanism - what breaks, when, and who pays. Missed criteria are joined into one paragraph after <code>coachLead</code>. This is where the teaching happens, so it is required.</p>

<p><b>model and modelExplain.</b> Learners do not get a model answer button (v0.3): they see the model answer in their saved report, after the scenario ends. The validator grades the model against its own rubric and fails the scenario if it does not reach <code>pass</code> - so a rubric that cannot recognise a good answer never ships.</p>

<p><b>Attempts (v0.3).</b> A learner gets 3 attempts at the written answer - set <code>"tries"</code> on the node or the deck to change it. After each graded attempt short of pass, they see how many rubric points they missed and the coaching, then choose <b>Improve my answer</b> (their text stays in the box) or <b>Submit as is</b>. After the last attempt the button just says Continue. The last submitted answer is the one that counts for the ending, the result code and the report. Grading shows a spinner, then a score pill and criteria revealing in sequence; set <code>GRADE_DELAY = 0</code> in the exported file to make it instant.</p>

<h2>Previews and exports<span class="new">v0.3</span></h2>
<ul>
<li><b>Laptop / Mobile</b> switches the preview's width.</li>
<li><b>Export for trainees</b> removes <code>trainerNote</code>, <code>reveals</code> and <code>redFlags</code> everywhere, then builds the file. This is the one you send to learners.</li>
</ul>

<h2>The Briefing button - context on demand</h2>
<p>Every choice, multi, evaluate and ending node carries a <b>Briefing</b> button. It opens what the learner has seen so far - briefing text and the consequences of their own decisions - so nobody has to scroll back while writing. The engine assembles it automatically; you only add <code>context</code> when you want to inject something extra.</p>
<pre>"context":[{"label":"Policy note","text":"Refunds over 5000 need a second approver."}]</pre>
<p>Grading is client-side keyword matching, deliberately. An API key in a shareable file is an exposed key. In a live session the rubric on screen is the artifact - you grade in the room.</p>

<h2>Send to trainer and result codes<span class="new">v0.3</span></h2>
<p>The last screen of every run now has a 'Send your result to your trainer' box. The learner types a name and taps one of:</p>
<ul>
<li><b>Send on WhatsApp</b> - opens WhatsApp with the result filled in, to the number in <code>sendTo.whatsapp</code> (digits with country code, for example <code>919800000000</code>). Leave it blank and the learner picks the chat.</li>
<li><b>Send by email</b> - opens their mail app with the result, to <code>sendTo.email</code>.</li>
<li><b>Copy result</b> - for anything else: Teams, a Google Form, a class channel.</li>
<li><b>Save my report</b> - downloads a small page with their choices, what they wrote, which criteria they met and the ending. It is theirs to keep.</li>
</ul>
<p>The ending screen no longer shows a separate session summary (v0.3) - the send box replaces it. The message it sends holds the plain summary and a <b>result code</b> starting <code>PUP2:</code>. The code carries every choice, every pick in a multi, the written answer, which criteria it met, the number of attempts and whether the model answer was used. It is encoded, not encrypted: anyone with the code can decode it, so treat it like the answer itself. The older <code>PUP|</code> line stays in the summary for your spreadsheets.</p>

<h2>Learner result<span class="new">v0.3</span></h2>
<p>Open the <b>Learner result</b> tab above the preview, paste one learner's message - a whole WhatsApp or email message is fine - and press <b>Show result</b>. Keep their scenario loaded on the left. You see their path as a diagram, each choice, what they noticed and missed, their written answer and which criteria it met. It reads the first <code>PUP2:</code> code only; the class dashboard is in the trainer edition. Nothing here leaves your browser.</p>

<h2>Anchor and pillar tagging</h2>
<p>Scenarios are tagged to an anchor - one of the eight Swanubhava&trade; behavioural anchors, grouped in three pillars (Individual posture, Boundary defining posture, Collaboration posture) - and to the specific behaviour it trains. Put the anchor name in <code>anchor</code>, verbatim, sentence case: the tag groups sessions, so a changed capital letter becomes a new anchor in the spreadsheet. Older files that use <code>competency</code> still work. The pillar is filled in from the anchor; set <code>pillar</code> only to override it. The behaviour is where rubric criteria come from - it is already written as an observable behaviour, which is what a criterion has to be.</p>
<p>The tag shows on the hub card and the rail, and travels in every session summary and compact code, so a term of sessions pivots by anchor (and pillar) in a spreadsheet: which anchors a cohort is weak on, not just which scenarios they found hard.</p>

<h2>Visual blocks</h2>
<p>Narrative screens, consequences and endings take an optional <code>blocks</code> list. Each block sits above the text (<code>"at":"top"</code>, the default) or below it (<code>"at":"bottom"</code>). They are drawn from the theme, so they need no files and work in both themes and offline.</p>
<pre>"blocks":[
 {"type":"post","author":"Meera","handle":"@meera","meta":"Monday, 8:52 am",
  "text":"My father died twelve days ago...",
  "reply":{"from":"SkyBridge assistant","text":"You can book now...","link":"Compassion fare policy"},
  "after":"Your bot told me to do exactly this.","stats":"1,800 reposts"},
 {"type":"people","title":"Three people matter this week",
  "people":[{"name":"Arjun","role":"Head of Customer Experience","lines":"..."}]},
 {"type":"image","alt":"what the picture shows","src":"","caption":"..."}
]</pre>
<p><b>post</b> is a social post, chat message or email, with an optional quoted reply styled like a screenshot. <b>people</b> is a cast card: initials, name, role, a line or two each. <b>image</b> shows the picture when <code>src</code> is an https link or a <code>data:image</code> URI, and a dashed 'Image to come' placeholder with the <code>alt</code> text when it is blank - so a planned visual is visible in a session before it exists. What a post or people block says is added to the Briefing panel, so learners can reread it while they write.</p>

<h2>Line breaks</h2>
<p>A <code>\n</code> inside any text field - narrative, consequence, lesson, prompt, verdict, the Briefing panel, trainer notes - shows as a line break, and <code>\n\n</code> as a blank line between paragraphs. Long lines still wrap. Use it for pointers and short paragraphs on long screens.</p>

<h2>Formatting<span class="new">v0.3</span></h2>
<p>Learner-facing text - narrative, consequence, lesson, decision and notice prompts, the speaker's question, the ending verdict, post text and the Briefing panel - takes four marks. The ending's one-line moral takes bold and underline only. Everything else stays plain.</p>
<ul>
<li><code>**words**</code> - <b>bold</b>. Use it for one phrase a screen, not a sentence.</li>
<li><code>__words__</code> - underline. Drawn in text colour so it is not mistaken for a link. Underscores inside a word (<code>file_name</code>) are left alone.</li>
<li>A line starting <code>- </code> - a bullet. Consecutive bullet lines, even with a blank line between them, make one list.</li>
<li>A line starting <code>1. </code> - a numbered list. Numbering starts from the first number you write.</li>
</ul>
<p>Option labels, keywords, model answers, trainer notes and learners' own answers stay plain. The session summary, WhatsApp message and dashboard excerpts drop the marks.</p>

<h2>Endings</h2>
<pre>{"step":4,"scene":"launch","title":"...","moral":"one line, italic",
 "verdict":"what actually happened",
 "revealed":[["The probe","what the learner did and why it mattered"]],
 "media":[]}</pre>

<h2>Media links</h2>
<p>Any node takes a <code>media</code> array. Links, never embeds - the file stays small and portable.</p>
<pre>"media":[{"type":"ppt","label":"Case pack","url":"https://..."},
         {"type":"video","label":"2-min setup","url":"https://..."}]</pre>

<h2>Scenes</h2>
<p>Procedural backdrops, no art needed: <code>stage</code> <code>river</code> <code>office</code> <code>data</code> <code>conflict</code> <code>team</code> <code>ai</code> <code>matrix</code> <code>launch</code> <code>storm</code>. Unknown names fall back to <code>stage</code>.</p>

<h2>What the validator checks</h2>
<ul>
<li>Every <code>to</code>, <code>toPass</code>, <code>toFail</code> resolves to a real node or ending</li>
<li>No unreachable nodes or orphan endings</li>
<li>Every rubric criterion has keywords - one without them can never be met</li>
<li>Every gated wrong answer carries a coaching note</li>
<li>Every ending has a verdict</li>
<li><code>sendTo</code> is an object (v0.3)</li>
</ul>


<h2>Theme</h2>
<p>Every exported file carries a dark and a light theme, toggled from the sun icon in the header and remembered per device. Light is a white and blue scheme for projectors and printed handouts. Scene art follows the theme automatically - it is drawn from the same tokens as the text.</p>

<h2>Layout</h2>
<p>The scene is a banner, capped at roughly a fifth of the viewport, so the words get the page. If you are writing long narrative text, that is the ratio to design for - do not expect the picture to carry meaning it cannot carry.</p>
<p><b>Your own picture, or none (v0.3).</b> Any screen, consequence or ending can take <code>"sceneImg": "https://..."</code> (with an optional <code>"sceneAlt"</code>) to replace the built-in art with your own image, or <code>"scene": "none"</code> to drop the banner. A consequence with no picture of its own uses its decision's. At scenario level, <code>"hideArt": true</code> removes the built-in art on every screen (your own pictures still show), and <code>"thumbImg"</code> replaces the card picture in the hub. Images are links, never embedded files.</p>
<p><b>The end report (v0.3).</b> The ending screen has a folded 'See your path' diagram, and 'Save my report' downloads a page with the same diagram, then each step: the situation, what you chose, what happened, why it worked or what it cost, the stronger move where you missed it, what you noticed and missed, your written answer with what it met, and the model answer. It is built from the scenario itself - nothing extra to write.</p>

<h2>Classroom</h2>
<p>Each run ends with the 'Send to trainer' box and a copyable summary in plain sentences, with a compact code as the last line:</p>
<pre>The Requirement That Wasn't - Product analysis scenario
Chose: Ask ops for a concrete case
Gap check: 3/3 of the must-haves
Written answer: 2/3 rubric criteria, short on who owns the call when it fails
Ending: Better, but still readable two ways
PUP|signoff|B>0+1+3(3/3)>written(2/3)|partial</pre>
<p>Students send it to you or drop it in the class channel. You read decisions, not just endings, and the debrief runs off what actually happened in the room - in the Learner result tab, one learner at a time, or by reading the messages.</p>
</script>

<script>
var srcEl=document.getElementById('src'),errEl=document.getElementById('err'),tipEl=document.getElementById('tips'),
    frame=document.getElementById('frame'),stEl=document.getElementById('status');
var VIEWMODE='trainee';

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function short(t,n){t=String(t||'').replace(/\*\*(\S(?:[^\n]*?\S)?)\*\*/g,'$1').replace(/(^|[^A-Za-z0-9_])__(\S(?:[^\n]*?\S)?)__(?![A-Za-z0-9_])/g,'$1$2').replace(/\s+/g,' ').trim();return t.length>n?t.slice(0,n-1)+'…':t;}
function pct(a,b){return b?Math.round(a/b*100):0;}

function engineSrc(){
  return document.getElementById('engine').textContent.split(/<\\\/script>/g).join('<'+'/script>');
}
/* trainee copies never carry trainer-only material */
var TRAINER_ONLY={trainerNote:1,reveals:1,redFlags:1};
function stripTrainer(o){
  if(Array.isArray(o))return o.map(stripTrainer);
  if(o&&typeof o==='object'){var r={};Object.keys(o).forEach(function(k){if(!TRAINER_ONLY[k])r[k]=stripTrainer(o[k]);});return r;}
  return o;
}
function build(json,view){
  var s=engineSrc(),d=view==='trainer'?json:stripTrainer(json);
  var title=(json.deckTitle||'The Puppeteer')+(json.scenarios&&json.scenarios.length===1?' - '+json.scenarios[0].title:'')+(view==='trainer'?' (trainer)':'');
  s=s.replace('__DECK_TITLE__',title.replace(/[<>]/g,''));
  if(view==='trainer')s=s.replace("/*__VIEW__*/'trainee'/*__VIEWEND__*/","/*__VIEW__*/'trainer'/*__VIEWEND__*/");
  var a=s.indexOf('/*__SCENARIO_JSON__*/'), b=s.indexOf('/*__END__*/');
  return s.slice(0,a)+JSON.stringify(d,null,1).replace(/<\/(script)/gi,'<\\/$1')+s.slice(b+'/*__END__*/'.length);
}

var VALID_NODE={narrative:1,choice:1,multi:1,evaluate:1};
function validate(json){
  var e=[];
  function chkBlocks(bl,where){
    if(bl==null)return;
    if(!Array.isArray(bl)){e.push(where+' blocks must be a list');return;}
    bl.forEach(function(b,bi){var w=where+' block '+bi+' ';
      if(!b||['post','people','image'].indexOf(b.type)<0){e.push(w+'has unknown type "'+(b&&b.type)+'" - use post, people or image');return;}
      if(b.at&&b.at!=='top'&&b.at!=='bottom')e.push(w+'"at" must be top or bottom');
      if(b.type==='post'&&!b.text&&!(b.reply&&b.reply.text))e.push(w+'(post) has no text');
      if(b.type==='people'){if(!(b.people||[]).length)e.push(w+'(people) has nobody in it');
        (b.people||[]).forEach(function(p,pi){if(!p||!p.name)e.push(w+'person '+pi+' has no name');});}
      if(b.type==='image'){if(!b.alt)e.push(w+'(image) has no alt - say what the picture shows');
        if(b.src&&!/^(https:\/\/|data:image\/)/.test(b.src))e.push(w+'(image) src must be an https link or a data:image URI');}
    });
  }
  /* v0.3: trainer-only fields must be plain text */
  function chkTrainer(o,where){
    if(o==null||typeof o!=='object')return;
    if(Array.isArray(o)){o.forEach(function(x){chkTrainer(x,where);});return;}
    Object.keys(o).forEach(function(k){var v=o[k];
      if((k==='trainerNote'||k==='reveals')&&typeof v!=='string')e.push(where+'"'+k+'" must be text');
      else if(v&&typeof v==='object')chkTrainer(v,where);});
  }
  if(json.sendTo!=null&&(typeof json.sendTo!=='object'||Array.isArray(json.sendTo)))e.push('sendTo must look like {"whatsapp":"919800000000","email":"you@example.com"}');
  if(!json.scenarios||!json.scenarios.length){e.push('no scenarios array');return e;}
  json.scenarios.forEach(function(s,si){
    var p='scenario['+si+'] '+(s.id||'(no id)')+': ';
    if(!s.id)e.push(p+'missing id');
    if(!s.title)e.push(p+'missing title');
    if(!s.start)e.push(p+'missing start');
    chkTrainer(s,p);
    var nodes=s.nodes||{},ends=s.endings||{};
    var targets=function(id){return nodes[id]||ends[id];};
    if(s.start&&!targets(s.start))e.push(p+'start "'+s.start+'" does not exist');
    Object.keys(nodes).forEach(function(k){
      var n=nodes[k],q=p+'node "'+k+'" ';
      if(!VALID_NODE[n.type]){e.push(q+'has unknown type "'+n.type+'"');return;}
      function chk(t,where){if(t&&!targets(t))e.push(q+where+' points at "'+t+'" which does not exist');}
      if(n.type==='narrative'){if(!n.to)e.push(q+'has no "to"');chk(n.to,'to');chkBlocks(n.blocks,q);}
      if(n.type==='choice'){
        if(!n.choices||!n.choices.length)e.push(q+'has no choices');
        (n.choices||[]).forEach(function(c,ci){
          var t=c.to||n.to;
          if(!t&&c.correct!==false)e.push(q+'choice '+ci+' has no "to"');
          chk(t,'choice '+ci);
          if(n.gate&&c.correct===false&&!(c.lesson||c.note))e.push(q+'gated wrong choice '+ci+' has no coaching lesson');
          if(c.consequence&&!c.consequence.text)e.push(q+'choice '+ci+' consequence has no text');
          if(c.consequence)chkBlocks(c.consequence.blocks,q+'choice '+ci+' consequence');
        });
      }
      if(n.type==='multi'){
        if(!n.options||!n.options.length)e.push(q+'has no options');
        if(!n.correct||!n.correct.length)e.push(q+'has no correct[] indexes');
        (n.correct||[]).forEach(function(i){if(!(n.options||[])[i])e.push(q+'correct index '+i+' out of range');});
        chk(n.to,'to');
      }
      if(n.type==='evaluate'){
        if(!n.criteria||!n.criteria.length)e.push(q+'has no rubric criteria');
        (n.criteria||[]).forEach(function(c,ci){
          if(!c.label)e.push(q+'criterion '+ci+' has no label');
          if(!c.keywords||!c.keywords.length)e.push(q+'criterion '+ci+' has no keywords - it can never be met');
          else if(c.keywords.length<8)e.push(q+'criterion '+ci+' has only '+c.keywords.length+
            ' keywords - aim for 15-25, mostly phrases, or real answers will fail it');
          if(!c.coach)e.push(q+'criterion '+ci+' has no coach sentence - feedback would only name the gap, not teach it');
        });
        if(!n.model)e.push(q+'has no model answer - learners working alone have nothing to compare against');
        if(n.model&&!n.modelExplain)e.push(q+'has a model answer but no modelExplain');
        if(n.model){
          var mres=(function(){
            var t=(' '+String(n.model).toLowerCase()+' ').replace(/[^a-z0-9\s]/g,' ');
            return (n.criteria||[]).filter(function(c){
              return (c.keywords||[]).some(function(k){return t.indexOf(k.toLowerCase())>-1;});}).length;
          })();
          if(mres<(n.pass||(n.criteria||[]).length))
            e.push(q+'model answer scores '+mres+'/'+(n.criteria||[]).length+
              ' against its own rubric - the keywords are too narrow or the model answer is wrong');
        }
        if(n.redFlags){
          var rf=Array.isArray(n.redFlags)?{phrases:n.redFlags}:n.redFlags;
          if(!rf.phrases||!rf.phrases.length)e.push(q+'redFlags has no phrases');
          else if(n.model){
            var norm=function(x){return String(x).toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();};
            var mt=' '+norm(n.model)+' ';
            var hit=rf.phrases.filter(function(ph){return mt.indexOf(' '+norm(ph)+' ')>-1;});
            if(hit.length)e.push(q+'model answer contains red-flag phrase(s): '+hit.join(', '));
          }
        }
        if(!n.speaker&&!n.prompt&&!n.question)e.push(q+'has no prompt or question');
        chk(n.toPass,'toPass');chk(n.toFail,'toFail');chk(n.to,'to');
        if(!n.toPass&&!n.to)e.push(q+'has no destination');
      }
    });
    var reach={},walk=function(id){
      if(!id||reach[id])return;reach[id]=1;
      var n=nodes[id];if(!n)return;
      if(n.to)walk(n.to);if(n.toPass)walk(n.toPass);if(n.toFail)walk(n.toFail);
      (n.choices||[]).forEach(function(c){walk(c.to||n.to);});
    };
    walk(s.start);
    Object.keys(nodes).concat(Object.keys(ends)).forEach(function(k){
      if(!reach[k])e.push(p+'"'+k+'" is unreachable from start');});
    Object.keys(ends).forEach(function(k){
      if(!ends[k].verdict)e.push(p+'ending "'+k+'" has no verdict');chkBlocks(ends[k].blocks,p+'ending "'+k+'"');});
  });
  return e;
}
/* not errors: what the trainer view and the dashboard are missing */
function run(){
  var json;
  try{json=JSON.parse(srcEl.value);}
  catch(ex){fail('JSON syntax: '+ex.message);return null;}
  var errs=validate(json);
  if(errs.length){fail(errs.length+' problem'+(errs.length>1?'s':'')+':\n- '+errs.join('\n- '));}
  else{errEl.classList.add('hidden');stEl.textContent='valid';stEl.className='st ok';}
  tipEl.classList.add('hidden');
  frame.srcdoc=build(json,VIEWMODE);
  if(document.getElementById('r-db').classList.contains('on'))renderDash();
  return json;
}
function fail(msg){
  errEl.textContent=msg;errEl.classList.remove('hidden');
  stEl.textContent='check errors';stEl.className='st bad';
}
function download(view){
  var json;try{json=JSON.parse(srcEl.value);}catch(ex){fail('JSON syntax: '+ex.message);return;}
  var name=(json.scenarios&&json.scenarios.length===1?json.scenarios[0].id:'puppeteer_deck')+(view==='trainer'?'-trainer':'')+'.html';
  var blob=new Blob([build(json,view)],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
}

      {k:'A',label:'',sub:'',tag:'',reveals:'',trainerNote:'',consequence:{title:'',text:'',lesson:''},to:'n2'},

  },
