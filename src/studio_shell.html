<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppeteer Studio</title>
<style>
:root{
  --indigo:#201A3E;--deep:#15112B;--surface:#2B2456;--surf2:#352C68;--coral:#FF6B4A;
  --teal:#16B5A4;--lav:#B9AEE8;--ink:#F3F0FF;--mute:#A79EC9;--line:#463C7F;--gold:#F2C14E;
  --serif:'Fraunces','Iowan Old Style',Georgia,serif;
  --sans:'Instrument Sans','Segoe UI',system-ui,-apple-system,Calibri,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--deep);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.bar{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--indigo);flex:none;flex-wrap:wrap}
.bar svg{width:26px;height:26px;flex:none}
.bar h1{font-family:var(--serif);font-size:16px;margin:0;font-weight:600}
.bar .sp{flex:1}
.bar .st{font-size:12.5px;color:var(--mute);font-family:var(--mono)}
.bar .st.ok{color:var(--teal)}
.bar .st.bad{color:var(--coral)}
.btn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:7px 13px;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--lav)}
.btn.go{background:var(--coral);border-color:var(--coral);color:#25100A;font-weight:650}
.btn.go:hover{background:#FF835F}
.btn.tl{background:var(--teal);border-color:var(--teal);color:#04211E;font-weight:650}
.btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2A1E00;font-weight:650}

main{flex:1;display:grid;grid-template-columns:minmax(340px,40%) 1fr;min-height:0}
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:8px 10px 0;flex:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);
  padding:7px 12px;font-size:13.5px;cursor:pointer}
.tab.on{color:var(--ink);border-bottom-color:var(--coral)}
.pane{flex:1;min-height:0;display:none}
.pane.on{display:flex;flex-direction:column}
textarea{flex:1;width:100%;background:var(--deep);color:#DCD6F5;border:0;border-top:1px solid var(--line);
  padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:none}
textarea:focus{outline:none}
.doc{overflow:auto;padding:16px 20px 40px;border-top:1px solid var(--line);font-size:14px;line-height:1.6}
.doc h2{font-family:var(--serif);font-size:17px;margin:20px 0 6px;font-weight:600}
.doc h2:first-child{margin-top:0}
.doc p{color:#DCD6F5;margin:0 0 10px;max-width:62ch}
.doc code{font-family:var(--mono);font-size:12px;background:var(--surface);padding:1px 5px;border-radius:4px;color:var(--lav)}
.doc pre{background:var(--indigo);border:1px solid var(--line);border-radius:9px;padding:12px 14px;
  overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.55;color:#CFC7F0}
.doc ul{margin:0 0 12px;padding-left:19px;color:#DCD6F5}
.doc li{margin-bottom:5px}
.doc .k{color:var(--gold)}
.doc .new{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:700;color:#2A1E00;background:var(--gold);border-radius:99px;padding:1px 8px;vertical-align:2px;margin-left:6px}
.right{min-height:0;display:flex;flex-direction:column;background:var(--indigo)}
.phead{padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute);
  display:flex;align-items:center;gap:10px;flex:none;flex-wrap:wrap}
.phead .seg{display:flex;gap:2px;background:var(--deep);border-radius:7px;padding:2px}
.phead .seg button{background:none;border:0;color:var(--mute);font-size:12.5px;padding:5px 11px;border-radius:5px;cursor:pointer}
.phead .seg button.on{background:var(--surface);color:var(--ink)}
.phead .sp{flex:1}
.rpane{flex:1;min-height:0;display:none}
.rpane.on{display:flex;flex-direction:column}
.frameWrap{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;padding:14px}
iframe{border:1px solid var(--line);border-radius:12px;background:var(--deep);width:100%;height:100%}
iframe.mob{width:390px;max-width:100%;height:100%;max-height:780px}
.err{margin:0;padding:11px 16px;background:rgba(255,107,74,.12);border-top:1px solid var(--coral);
  color:#FFC5B5;font-family:var(--mono);font-size:12px;white-space:pre-wrap;flex:none}
.tipbar{margin:0;padding:9px 16px;background:rgba(242,193,78,.10);border-top:1px solid var(--gold);color:#F6DFA3;font-size:12.5px;flex:none}
.hidden{display:none!important}

/* session dashboard */
.dash{flex:1;overflow:auto;padding:14px 18px 40px;font-size:14px;line-height:1.5}
.dash textarea{flex:none;min-height:96px;border:1px solid var(--line);border-radius:9px;font-size:12px}
.drow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.dnote{color:var(--mute);font-size:13px;margin:0}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.dcard h3{font-family:var(--serif);font-size:17px;margin:0 0 4px;font-weight:600}
.dcard h4{font-size:13.5px;margin:0 0 8px;color:var(--lav);font-weight:600}
.dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0 0}
.dtile{background:var(--deep);border-radius:9px;padding:8px 10px}
.dtile small{display:block;color:var(--mute);font-size:11.5px}
.dtile b{font-size:20px;font-variant-numeric:tabular-nums}
.bar2{margin:7px 0}
.bar2 .l{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.bar2 .l span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar2 .t{height:7px;background:var(--deep);border-radius:4px;margin-top:3px}
.bar2 .f{height:7px;border-radius:4px;background:var(--lav)}
.bar2.good .f{background:var(--teal)}
.bar2.trap .f{background:var(--coral)}
.tg{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;margin-left:4px}
.tg.good{background:var(--teal);color:#04211E}
.tg.trap{background:var(--coral);color:#25100A}
.ins{margin:8px 0 0;font-size:13px;color:#DCD6F5;border-left:3px solid var(--gold);padding:3px 10px}
.ans{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:6px 0;font-size:13px;color:#DCD6F5;white-space:pre-line}
.ans small{display:block;color:var(--mute);font-size:11.5px;margin-bottom:3px}
table.lt{width:100%;border-collapse:collapse;font-size:13px}
.lt th,.lt td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.lt th{color:var(--mute);font-weight:600;font-size:12px}
.lt tr.click{cursor:pointer}
.lt tr.click:hover td{background:var(--surf2)}
.drill{margin:0}
.dpath{display:flex;flex-direction:column;margin:4px 0 14px}
.dpath .pn{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--surf2)}
.dpath .pk{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:650}
.dpath .pq{font-size:13px;margin:2px 0 6px}
.dpath .po{display:flex;flex-wrap:wrap;gap:5px}
.dpath .pc{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--mute)}
.dpath .pc.on{color:#fff;font-weight:650;border-color:transparent;background:#6B6F8A}
.dpath .pc.on.good,.dpath .pc.hit{background:var(--teal);color:#04211E;border-color:transparent}
.dpath .pc.on.trap,.dpath .pc.extra{background:var(--coral);color:#25100A;border-color:transparent}
.dpath .pc.tried{text-decoration:line-through;border-style:dashed}
.dpath .pc.miss{border:1.5px dashed var(--teal);color:var(--ink)}
.dpath .pa{width:2px;height:14px;background:var(--line);margin:0 auto}
.dpath .pcq{border-left:4px solid #6B6F8A;border-radius:6px;padding:6px 10px;background:var(--deep);font-size:12.5px;color:#DCD6F5}
.dpath .pcq.good{border-left-color:var(--teal)}.dpath .pcq.trap{border-left-color:var(--coral)}
.dpath .pcq b{display:block;color:var(--ink);font-size:12px}
.dpath .pend{border:2px solid var(--ink);border-radius:9px;padding:7px 10px;text-align:center;font-weight:650;font-size:13px}
.drill dt{font-weight:600;margin-top:10px;color:var(--ink)}
.drill dd{margin:2px 0 0;color:#DCD6F5;white-space:pre-line}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.left{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header class="bar">
  <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
    <path d="M6 8h28" stroke="#FF6B4A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M12 8v13M20 8v19M28 8v13" stroke="#463C7F" stroke-width="1.3"/>
    <rect x="8.5" y="21" width="7" height="7" rx="1.4" transform="rotate(45 12 24.5)" fill="#16B5A4"/>
    <rect x="16.5" y="27" width="7" height="7" rx="1.4" transform="rotate(45 20 30.5)" fill="#B9AEE8"/>
    <rect x="24.5" y="21" width="7" height="7" rx="1.4" transform="rotate(45 28 24.5)" fill="#F2C14E"/>
  </svg>
  <h1>Puppeteer Studio</h1>
  <span class="st" title="Studio and engine version">v__VERSION__</span>
  <span class="st" id="status">ready</span>
  <span class="sp"></span>
  <button class="btn" id="btnSkel">New skeleton</button>
  <button class="btn" id="btnSample">Load sample</button>
  <button class="btn go" id="btnRun">Preview</button>
  <button class="btn tl" id="btnExportT" title="Trainer notes, 'reveals' lines and red flags are removed">Export for trainees</button>
  <button class="btn" id="btnExportR" title="Everything included, opens in trainer view">Export for trainer</button>
</header>

<main>
  <section class="left">
    <div class="tabs">
      <button class="tab on" data-p="edit">Scenario JSON</button>
      <button class="tab" data-p="docs">Schema</button>
    </div>
    <div class="pane on" id="p-edit"><textarea id="src" spellcheck="false"></textarea></div>
    <div class="pane" id="p-docs"><div class="doc" id="docs"></div></div>
    <p class="tipbar hidden" id="tips"></p>
    <pre class="err hidden" id="err"></pre>
  </section>
  <section class="right">
    <div class="phead">
      <span class="seg" id="rtabs"><button class="on" data-r="pv">Preview</button><button data-r="db">Session dashboard</button></span>
      <span class="sp"></span>
      <span class="seg" id="vseg" title="Trainee view is what learners get. Trainer view adds trap and expert tags, 'reveals' lines and trainer notes."><button class="on" data-v="trainee">Trainee view</button><button data-v="trainer">Trainer view</button></span>
      <span class="seg" id="wseg"><button class="on" data-w="desk">Laptop</button><button data-w="mob">Mobile</button></span>
    </div>
    <div class="rpane on" id="r-pv"><div class="frameWrap"><iframe id="frame" title="Preview"></iframe></div></div>
    <div class="rpane" id="r-db"><div class="dash">
      <textarea id="resIn" spellcheck="false" placeholder="Paste what learners sent you - whole WhatsApp or email messages are fine. Every PUP2: result code in the text is picked up."></textarea>
      <div class="drow">
        <button class="btn go" id="btnDash">Build dashboard</button>
        <button class="btn" id="btnSampleRes">Load sample results</button>
        <button class="btn" id="btnProj" aria-pressed="false">Projection mode</button>
        <button class="btn" id="btnClear">Clear</button>
        <span class="dnote" id="dashCount"></span>
      </div>
      <div id="dashOut"></div>
    </div></div>
  </section>
</main>

<script type="text/plain" id="engine">__ENGINE_SRC__</script>
<script type="text/plain" id="sample">__SAMPLE_JSON__</script>
<script type="text/plain" id="docsrc">__DOCS__</script>

<script>
var srcEl=document.getElementById('src'),errEl=document.getElementById('err'),tipEl=document.getElementById('tips'),
    frame=document.getElementById('frame'),stEl=document.getElementById('status');
var VIEWMODE='trainee';

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function short(t,n){t=String(t||'').replace(/\s+/g,' ').trim();return t.length>n?t.slice(0,n-1)+'…':t;}
function pct(a,b){return b?Math.round(a/b*100):0;}

function engineSrc(){
  return document.getElementById('engine').textContent.split(/<\\\/script>/g).join('<'+'/script>');
}
/* trainee copies never carry trainer-only material */
var TRAINER_ONLY={trainerNote:1,reveals:1,redFlags:1};
function stripTrainer(o){
  if(Array.isArray(o))return o.map(stripTrainer);
  if(o&&typeof o==='object'){var r={};Object.keys(o).forEach(function(k){if(!TRAINER_ONLY[k])r[k]=stripTrainer(o[k]);});return r;}
  return o;
}
function build(json,view){
  var s=engineSrc(),d=view==='trainer'?json:stripTrainer(json);
  var title=(json.deckTitle||'The Puppeteer')+(json.scenarios&&json.scenarios.length===1?' - '+json.scenarios[0].title:'')+(view==='trainer'?' (trainer)':'');
  s=s.replace('__DECK_TITLE__',title.replace(/[<>]/g,''));
  if(view==='trainer')s=s.replace("/*__VIEW__*/'trainee'/*__VIEWEND__*/","/*__VIEW__*/'trainer'/*__VIEWEND__*/");
  var a=s.indexOf('/*__SCENARIO_JSON__*/'), b=s.indexOf('/*__END__*/');
  return s.slice(0,a)+JSON.stringify(d,null,1).replace(/<\/(script)/gi,'<\\/$1')+s.slice(b+'/*__END__*/'.length);
}

var VALID_NODE={narrative:1,choice:1,multi:1,evaluate:1};
function validate(json){
  var e=[];
  function chkBlocks(bl,where){
    if(bl==null)return;
    if(!Array.isArray(bl)){e.push(where+' blocks must be a list');return;}
    bl.forEach(function(b,bi){var w=where+' block '+bi+' ';
      if(!b||['post','people','image'].indexOf(b.type)<0){e.push(w+'has unknown type "'+(b&&b.type)+'" - use post, people or image');return;}
      if(b.at&&b.at!=='top'&&b.at!=='bottom')e.push(w+'"at" must be top or bottom');
      if(b.type==='post'&&!b.text&&!(b.reply&&b.reply.text))e.push(w+'(post) has no text');
      if(b.type==='people'){if(!(b.people||[]).length)e.push(w+'(people) has nobody in it');
        (b.people||[]).forEach(function(p,pi){if(!p||!p.name)e.push(w+'person '+pi+' has no name');});}
      if(b.type==='image'){if(!b.alt)e.push(w+'(image) has no alt - say what the picture shows');
        if(b.src&&!/^(https:\/\/|data:image\/)/.test(b.src))e.push(w+'(image) src must be an https link or a data:image URI');}
    });
  }
  /* v0.3: trainer-only fields must be plain text */
  function chkTrainer(o,where){
    if(o==null||typeof o!=='object')return;
    if(Array.isArray(o)){o.forEach(function(x){chkTrainer(x,where);});return;}
    Object.keys(o).forEach(function(k){var v=o[k];
      if((k==='trainerNote'||k==='reveals')&&typeof v!=='string')e.push(where+'"'+k+'" must be text');
      else if(v&&typeof v==='object')chkTrainer(v,where);});
  }
  if(json.sendTo!=null&&(typeof json.sendTo!=='object'||Array.isArray(json.sendTo)))e.push('sendTo must look like {"whatsapp":"919800000000","email":"you@example.com"}');
  if(!json.scenarios||!json.scenarios.length){e.push('no scenarios array');return e;}
  json.scenarios.forEach(function(s,si){
    var p='scenario['+si+'] '+(s.id||'(no id)')+': ';
    if(!s.id)e.push(p+'missing id');
    if(!s.title)e.push(p+'missing title');
    if(!s.start)e.push(p+'missing start');
    chkTrainer(s,p);
    var nodes=s.nodes||{},ends=s.endings||{};
    var targets=function(id){return nodes[id]||ends[id];};
    if(s.start&&!targets(s.start))e.push(p+'start "'+s.start+'" does not exist');
    Object.keys(nodes).forEach(function(k){
      var n=nodes[k],q=p+'node "'+k+'" ';
      if(!VALID_NODE[n.type]){e.push(q+'has unknown type "'+n.type+'"');return;}
      function chk(t,where){if(t&&!targets(t))e.push(q+where+' points at "'+t+'" which does not exist');}
      if(n.type==='narrative'){if(!n.to)e.push(q+'has no "to"');chk(n.to,'to');chkBlocks(n.blocks,q);}
      if(n.type==='choice'){
        if(!n.choices||!n.choices.length)e.push(q+'has no choices');
        (n.choices||[]).forEach(function(c,ci){
          var t=c.to||n.to;
          if(!t&&c.correct!==false)e.push(q+'choice '+ci+' has no "to"');
          chk(t,'choice '+ci);
          if(n.gate&&c.correct===false&&!(c.lesson||c.note))e.push(q+'gated wrong choice '+ci+' has no coaching lesson');
          if(c.consequence&&!c.consequence.text)e.push(q+'choice '+ci+' consequence has no text');
          if(c.consequence)chkBlocks(c.consequence.blocks,q+'choice '+ci+' consequence');
        });
      }
      if(n.type==='multi'){
        if(!n.options||!n.options.length)e.push(q+'has no options');
        if(!n.correct||!n.correct.length)e.push(q+'has no correct[] indexes');
        (n.correct||[]).forEach(function(i){if(!(n.options||[])[i])e.push(q+'correct index '+i+' out of range');});
        chk(n.to,'to');
      }
      if(n.type==='evaluate'){
        if(!n.criteria||!n.criteria.length)e.push(q+'has no rubric criteria');
        (n.criteria||[]).forEach(function(c,ci){
          if(!c.label)e.push(q+'criterion '+ci+' has no label');
          if(!c.keywords||!c.keywords.length)e.push(q+'criterion '+ci+' has no keywords - it can never be met');
          else if(c.keywords.length<8)e.push(q+'criterion '+ci+' has only '+c.keywords.length+
            ' keywords - aim for 15-25, mostly phrases, or real answers will fail it');
          if(!c.coach)e.push(q+'criterion '+ci+' has no coach sentence - feedback would only name the gap, not teach it');
        });
        if(!n.model)e.push(q+'has no model answer - learners working alone have nothing to compare against');
        if(n.model&&!n.modelExplain)e.push(q+'has a model answer but no modelExplain');
        if(n.model){
          var mres=(function(){
            var t=(' '+String(n.model).toLowerCase()+' ').replace(/[^a-z0-9\s]/g,' ');
            return (n.criteria||[]).filter(function(c){
              return (c.keywords||[]).some(function(k){return t.indexOf(k.toLowerCase())>-1;});}).length;
          })();
          if(mres<(n.pass||(n.criteria||[]).length))
            e.push(q+'model answer scores '+mres+'/'+(n.criteria||[]).length+
              ' against its own rubric - the keywords are too narrow or the model answer is wrong');
        }
        if(n.redFlags){
          var rf=Array.isArray(n.redFlags)?{phrases:n.redFlags}:n.redFlags;
          if(!rf.phrases||!rf.phrases.length)e.push(q+'redFlags has no phrases');
          else if(n.model){
            var norm=function(x){return String(x).toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();};
            var mt=' '+norm(n.model)+' ';
            var hit=rf.phrases.filter(function(ph){return mt.indexOf(' '+norm(ph)+' ')>-1;});
            if(hit.length)e.push(q+'model answer contains red-flag phrase(s): '+hit.join(', '));
          }
        }
        if(!n.speaker&&!n.prompt&&!n.question)e.push(q+'has no prompt or question');
        chk(n.toPass,'toPass');chk(n.toFail,'toFail');chk(n.to,'to');
        if(!n.toPass&&!n.to)e.push(q+'has no destination');
      }
    });
    var reach={},walk=function(id){
      if(!id||reach[id])return;reach[id]=1;
      var n=nodes[id];if(!n)return;
      if(n.to)walk(n.to);if(n.toPass)walk(n.toPass);if(n.toFail)walk(n.toFail);
      (n.choices||[]).forEach(function(c){walk(c.to||n.to);});
    };
    walk(s.start);
    Object.keys(nodes).concat(Object.keys(ends)).forEach(function(k){
      if(!reach[k])e.push(p+'"'+k+'" is unreachable from start');});
    Object.keys(ends).forEach(function(k){
      if(!ends[k].verdict)e.push(p+'ending "'+k+'" has no verdict');chkBlocks(ends[k].blocks,p+'ending "'+k+'"');});
  });
  return e;
}
/* not errors: what the trainer view and the dashboard are missing */
function trainerGaps(json){
  var opts=0,miss=0;
  (json.scenarios||[]).forEach(function(s){Object.keys(s.nodes||{}).forEach(function(k){var n=s.nodes[k];
    if(n.type==='choice')(n.choices||[]).forEach(function(c){opts++;if(!c.reveals)miss++;});});});
  return miss?'Trainer view: '+miss+' of '+opts+' decision options have no "reveals" line, so the dashboard cannot say what choosing them suggests. Not an error.':'';
}

function run(){
  var json;
  try{json=JSON.parse(srcEl.value);}
  catch(ex){fail('JSON syntax: '+ex.message);return null;}
  var errs=validate(json);
  if(errs.length){fail(errs.length+' problem'+(errs.length>1?'s':'')+':\n- '+errs.join('\n- '));}
  else{errEl.classList.add('hidden');stEl.textContent='valid';stEl.className='st ok';}

function cutP(x,n){x=String(x||'').replace(/\s+/g,' ').trim();if(x.length<=n)return x;var c=x.slice(0,n),i=c.lastIndexOf('. ');

/* the same path diagram the learner's report shows, rebuilt from the result code */
function pathOf(s,r){var nodes=s.nodes||{},seen={},grp=[],out=[];
  (r.log||[]).forEach(function(l){var k=l.n+'|'+l.k;if(!(k in seen)){seen[k]=grp.length;grp.push({l:null,tried:[]});}
    var g=grp[seen[k]];if(l.k==='c'&&l.g)g.tried.push(l.i);else g.l=l;});
  grp.forEach(function(g,gi){var l=g.l;if(!l)return;var n=nodes[l.n];if(!n)return;
    var lab=(typeof n.step==='number'&&s.steps&&s.steps[n.step])||('Step '+(gi+1)),hd='<div class="pk">'+esc(lab)+'</div>';

      out.push('<div class="pn">'+hd+'<div class="pq">'+esc(cutP(n.prompt,120))+'</div><div class="po">'+(n.choices||[]).map(function(o,i){

          return p&&m?'<span class="pc hit">&#10003; '+x+'</span>':p?'<span class="pc extra">&#10007; '+x+'</span>':m?'<span class="pc miss">missed: '+x+'</span>':'';}).join('')+'</div></div>');}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function simRun(s,name,rnd){var log=[],id=s.start,guard=0,nodes=s.nodes||{};
  while(guard++<80){var n=nodes[id];if(!n)break;
    if(n.type==='narrative'){id=n.to;continue;}
    if(n.type==='choice'){var ch=n.choices||[],goods=[],traps=[];
      ch.forEach(function(c,i){(choiceGood(n,c)===true?goods:traps).push(i);});
      var pick=(traps.length&&rnd()<0.55)?traps[Math.floor(rnd()*traps.length)]:(goods.length?goods[Math.floor(rnd()*goods.length)]:Math.floor(rnd()*ch.length));
      if(n.gate&&ch[pick].correct===false){log.push({k:'c',n:id,i:pick,g:1});pick=goods.length?goods[0]:pick;}
      log.push({k:'c',n:id,i:pick,g:0});id=ch[pick].to||n.to;continue;}
    if(n.type==='multi'){var sel=(n.correct||[]).filter(function(){return rnd()<0.75;});
      (n.options||[]).forEach(function(o,i){if((n.correct||[]).indexOf(i)<0&&rnd()<0.2)sel.push(i);});
      log.push({k:'m',n:id,sel:sel});id=n.to;continue;}
    if(n.type==='evaluate'){var met=(n.criteria||[]).map(function(){return rnd()<0.62?1:0;}),full=met.every(Boolean);
      var ans=full?(n.model||''):'I would talk to the team and make sure the line is clear before Friday, so nobody is surprised later.';
      log.push({k:'w',n:id,met:met,tr:full?1+(rnd()<0.3?1:0):2+(rnd()<0.4?1:0),mu:(!full&&rnd()<0.2)?1:0,a:ans});
      id=full?(n.toPass||n.to):(n.toFail||n.to);continue;}
    break;}
  return {v:2,s:s.id,t:s.title,n:name,at:new Date().toISOString(),end:id,log:log};}

function segWire(id,fn){var g=document.getElementById(id);
  Array.prototype.forEach.call(g.querySelectorAll('button'),function(b){b.addEventListener('click',function(){
    g.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');fn(b);});});}
segWire('wseg',function(b){frame.className=b.getAttribute('data-w')==='mob'?'mob':'';});
segWire('vseg',function(b){VIEWMODE=b.getAttribute('data-v');run();});
segWire('rtabs',function(b){var db=b.getAttribute('data-r')==='db';
  document.getElementById('r-pv').classList.toggle('on',!db);document.getElementById('r-db').classList.toggle('on',db);
  document.getElementById('vseg').style.visibility=db?'hidden':'';document.getElementById('wseg').style.visibility=db?'hidden':'';
  if(db)renderDash();});
srcEl.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&(e.key==='Enter'||e.key==='s')){e.preventDefault();run();}
  if(e.key==='Tab'){e.preventDefault();var s=srcEl.selectionStart;
    srcEl.value=srcEl.value.slice(0,s)+'  '+srcEl.value.slice(srcEl.selectionEnd);
    srcEl.selectionStart=srcEl.selectionEnd=s+2;}
});

document.getElementById('docs').innerHTML=document.getElementById('docsrc').textContent;
srcEl.value=JSON.stringify(JSON.parse(document.getElementById('sample').textContent),null,2);
run();
</script>
</body>
</html>
